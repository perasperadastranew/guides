<title>туманность — тест маскота</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0a14;--ink:#f3f1ff;--mute:#8d88b5;--line:#2a2648;--chip:#16132a}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto;touch-action:manipulation}
.stage{flex:0 0 auto;height:min(54vh,460px);width:100%;display:flex;align-items:center;justify-content:center}
svg{width:min(100%,560px);height:100%;display:block;overflow:visible}
.word{font-size:clamp(34px,9vw,64px);font-weight:600;letter-spacing:-0.045em;line-height:1;margin:0 0 6px;min-height:1em;transition:opacity .18s}
.note{color:var(--mute);font-size:15px;letter-spacing:-0.01em;margin:0 0 18px;min-height:1.3em;text-align:center;padding:0 20px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px;margin-bottom:10px}
button{font:inherit;font-size:15px;letter-spacing:-0.01em;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:#4a437e}
button:focus-visible{outline:2px solid #c8f031;outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:#0b0a14;border-color:var(--ink)}
.eyesrow{margin-bottom:22px}
.row span{color:var(--mute);font-size:15px;align-self:center;margin-right:4px}
.core{opacity:0;transform:scale(.2) rotate(-40deg);transform-box:fill-box;transform-origin:center;transition:opacity .22s ease,transform .45s cubic-bezier(.34,1.56,.64,1)}
.core.on{opacity:1;transform:scale(1) rotate(0)}
.eyeset{opacity:0;transition:opacity .2s}
.eyeset.on{opacity:1}
.dust circle{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.dust circle{animation:none}}
</style>
</head>
