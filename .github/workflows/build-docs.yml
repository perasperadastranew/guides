name: Сборка документов школы (PDF)

on:
  push:
    branches: [main]
    paths:
      - 'dokumenty-shkoly/src/**'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Шрифты
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: HTML -> PDF
        run: |
          for f in dokumenty-shkoly/src/*.html; do
            n=$(basename "$f" .html)
            google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="dokumenty-shkoly/$n.pdf" "file://$PWD/$f"
          done
          ls -la dokumenty-shkoly
      - name: Коммит PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dokumenty-shkoly/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Сборка PDF документов школы"
          git pull --rebase
          git push
