<div id="pg-ai-start" style="margin:0;padding:0;background:#0B0B0B">
<iframe id="pg-ai-start-frame" src="https://perasperadastranew.github.io/guides/ai-start/index-short.html" title="Как начать в AI-индустрии" style="display:block;width:100%;height:100vh;border:0;background:#0B0B0B" scrolling="no" loading="eager"></iframe>
</div>
<script>
(function(){var f=document.getElementById('pg-ai-start-frame');
window.addEventListener('message',function(e){if(e.source!==f.contentWindow||!e.data)return;
if(e.data.type==='pad-height'&&e.data.h){f.style.height=Math.ceil(e.data.h)+'px'}
if(e.data.type==='pad-scroll'){var y=f.getBoundingClientRect().top+window.pageYOffset+e.data.y;window.scrollTo({top:y,behavior:'smooth'})}});})();
</script>
