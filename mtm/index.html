<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Методички Mission to Motion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Все методички Mission to Motion: слева оглавление по неделям, справа методичка. */
:root{color-scheme:dark;--field:#1c1c1c;--panel:#101010;--card:#191919;--stroke:#2a2a2a;--ink:#f4f4f2;--dim:#8e8e8c;--faint:#5a5a58;--accent:#eb7540;--good:#34c759;
--body:"Onest",-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--field);color:var(--dim);font:15px/1.4 var(--body);display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
aside{background:var(--panel);border-radius:14px;padding:20px 14px;display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);line-height:1.4;padding:0 6px}
h1{margin:0;font-weight:400;font-size:24px;line-height:1.05;color:var(--ink);letter-spacing:-.02em;padding:0 6px}
.prog{padding:0 6px;display:flex;flex-direction:column;gap:6px}
.prog .bar{height:4px;border-radius:2px;background:var(--stroke);overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.prog span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.grp{display:flex;flex-direction:column;gap:2px}
.gname{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 6px 6px}
.it{display:grid;grid-template-columns:24px minmax(0,1fr) 14px;gap:8px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 6px;color:var(--dim);font:inherit;cursor:pointer}
.it:hover{background:var(--card)}
.it:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.it[aria-current="true"]{background:var(--card);border-color:var(--stroke);color:var(--ink)}
.it .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.it .ok{width:10px;height:10px;border-radius:50%;border:1px solid var(--faint)}
.it.done .ok{background:var(--good);border-color:var(--good)}
main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-width:0;min-height:0}
.bar-top{background:var(--panel);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar-top .cur{color:var(--ink);font-size:17px;flex:1 1 200px;min-width:0}
.bar-top .cur small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
button.b{background:var(--card);color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.b[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.notes{flex:1 1 100%;display:none}
.notes.open{display:flex;flex-direction:column;gap:6px}
.notes textarea{width:100%;min-height:72px;resize:vertical;background:var(--card);color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:10px 12px;font:inherit}
.notes span{font-size:13px}
.frame{background:var(--panel);border-radius:14px;overflow:hidden;min-height:0}
iframe{display:block;width:100%;height:100%;border:0;background:#1c1c1c}
select{display:none}
@media (max-width:900px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  aside{display:none}
  select{display:block;flex:1 1 100%;background:var(--card);color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:10px;font:inherit}
  .bar-top .cur{display:none}
}
@media (max-width:900px){
  html,body{height:auto}
  body{grid-template-rows:auto auto;padding:8px}
  main{grid-template-rows:auto auto}
  .frame{height:calc(100dvh - 150px);min-height:420px}
  .bar-top{gap:6px;padding:10px}
  select{width:100%;min-width:0;max-width:100%}
  button.b{padding:8px 10px;font-size:13px;flex:1 1 auto}
  #nbtn{display:none}
}
@media (prefers-reduced-motion:reduce){.prog .bar i{transition:none}}
</style>
<aside>
  <div class="brand">PERASPERADASTRA<br>MISSION TO MOTION</div>
  <h1>Все методички курса</h1>
  <div class="prog"><div class="bar"><i id="pbar"></i></div><span id="ptxt">Прочитано 0 из 19</span></div>
  <nav aria-label="Методички"><div class="grp"><span class="gname">Старт</span><button type="button" class="it" data-slug="mtm-calendar"><span class="n">◷</span><span class="t">Календарь потока</span><span class="ok" aria-hidden="true"></span></button></div><div class="grp"><span class="gname">Недели 1–2 · Основы</span><button type="button" class="it" data-slug="professiya"><span class="n">02</span><span class="t">Профессия и процесс</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="osnovy-ae"><span class="n">03</span><span class="t">Основы After Effects</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="grafiki-i-principy"><span class="n">04</span><span class="t">Графики и принципы</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="stilizaciya"><span class="n">05</span><span class="t">Стилизация и эффекты</span><span class="ok" aria-hidden="true"></span></button></div><div class="grp"><span class="gname">Недели 3–4 · After Effects</span><button type="button" class="it" data-slug="kineticheskaya-tipografika"><span class="n">06</span><span class="t">Кинетическая типографика</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="3d-kamera"><span class="n">07</span><span class="t">3D-камера и параллакс</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="treking-kompoziting"><span class="n">08</span><span class="t">Трекинг, ротоскоп, композитинг</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="ekspresheny-skripty"><span class="n">09</span><span class="t">Экспрешены, плагины и скрипты</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="animaciya-interfejsov"><span class="n">10</span><span class="t">Анимация интерфейсов</span><span class="ok" aria-hidden="true"></span></button></div><div class="grp"><span class="gname">Недели 5–6 · Идея и раскадровка</span><button type="button" class="it" data-slug="koncepciya-scenarij"><span class="n">11</span><span class="t">Концепция и сценарий</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="referensy"><span class="n">12</span><span class="t">Работа с референсами</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="raskadrovka"><span class="n">13</span><span class="t">Раскадровка</span><span class="ok" aria-hidden="true"></span></button></div><div class="grp"><span class="gname">Недели 7–10 · Ролик</span><button type="button" class="it" data-slug="montazh"><span class="n">14</span><span class="t">Монтаж: склейки, переходы, крупности</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="razgovornoe-video"><span class="n">15</span><span class="t">Разговорное видео</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="zvuk-i-ritm"><span class="n">16</span><span class="t">Саунд-дизайн и визуальный ритм</span><span class="ok" aria-hidden="true"></span></button></div><div class="grp"><span class="gname">Недели 11–12 · Финал</span><button type="button" class="it" data-slug="nejroseti-v-moushne"><span class="n">17</span><span class="t">Нейросети в моушне</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="diplom"><span class="n">18</span><span class="t">Дипломный проект и портфолио</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="lichnyj-brend"><span class="n">19</span><span class="t">Личный бренд дизайнера</span><span class="ok" aria-hidden="true"></span></button></div></nav>
</aside>
<main>
  <div class="bar-top">
    <select id="pick" aria-label="Выбрать методичку"><option value="mtm-calendar">Старт · Календарь потока</option><option value="professiya">Недели 1–2 · Основы · Профессия и процесс</option><option value="osnovy-ae">Недели 1–2 · Основы · Основы After Effects</option><option value="grafiki-i-principy">Недели 1–2 · Основы · Графики и принципы</option><option value="stilizaciya">Недели 1–2 · Основы · Стилизация и эффекты</option><option value="kineticheskaya-tipografika">Недели 3–4 · After Effects · Кинетическая типографика</option><option value="3d-kamera">Недели 3–4 · After Effects · 3D-камера и параллакс</option><option value="treking-kompoziting">Недели 3–4 · After Effects · Трекинг, ротоскоп, композитинг</option><option value="ekspresheny-skripty">Недели 3–4 · After Effects · Экспрешены, плагины и скрипты</option><option value="animaciya-interfejsov">Недели 3–4 · After Effects · Анимация интерфейсов</option><option value="koncepciya-scenarij">Недели 5–6 · Идея и раскадровка · Концепция и сценарий</option><option value="referensy">Недели 5–6 · Идея и раскадровка · Работа с референсами</option><option value="raskadrovka">Недели 5–6 · Идея и раскадровка · Раскадровка</option><option value="montazh">Недели 7–10 · Ролик · Монтаж: склейки, переходы, крупности</option><option value="razgovornoe-video">Недели 7–10 · Ролик · Разговорное видео</option><option value="zvuk-i-ritm">Недели 7–10 · Ролик · Саунд-дизайн и визуальный ритм</option><option value="nejroseti-v-moushne">Недели 11–12 · Финал · Нейросети в моушне</option><option value="diplom">Недели 11–12 · Финал · Дипломный проект и портфолио</option><option value="lichnyj-brend">Недели 11–12 · Финал · Личный бренд дизайнера</option></select>
    <div class="cur"><small id="cur-mod"></small><span id="cur-t"></span></div>
    <button type="button" class="b" id="prev">← Назад</button>
    <button type="button" class="b" id="next">Дальше →</button>
    <button type="button" class="b" id="done" aria-pressed="false">Отметить прочитанным</button>
    <button type="button" class="b" id="nbtn" aria-expanded="false">Заметки</button>
    <div class="notes" id="notes"><textarea id="ntext" placeholder="Заметки к методичке"></textarea><span>Заметки и отметки хранятся только в этом браузере. </span></div>
  </div>
  <div class="frame"><iframe id="view" title="Методичка"></iframe></div>
</main>

<script>
(function(){
  const ORDER=[{"slug": "mtm-calendar", "title": "Календарь потока", "mod": "Старт"}, {"slug": "professiya", "title": "Профессия и процесс", "mod": "Недели 1–2 · Основы"}, {"slug": "osnovy-ae", "title": "Основы After Effects", "mod": "Недели 1–2 · Основы"}, {"slug": "grafiki-i-principy", "title": "Графики и принципы", "mod": "Недели 1–2 · Основы"}, {"slug": "stilizaciya", "title": "Стилизация и эффекты", "mod": "Недели 1–2 · Основы"}, {"slug": "kineticheskaya-tipografika", "title": "Кинетическая типографика", "mod": "Недели 3–4 · After Effects"}, {"slug": "3d-kamera", "title": "3D-камера и параллакс", "mod": "Недели 3–4 · After Effects"}, {"slug": "treking-kompoziting", "title": "Трекинг, ротоскоп, композитинг", "mod": "Недели 3–4 · After Effects"}, {"slug": "ekspresheny-skripty", "title": "Экспрешены, плагины и скрипты", "mod": "Недели 3–4 · After Effects"}, {"slug": "animaciya-interfejsov", "title": "Анимация интерфейсов", "mod": "Недели 3–4 · After Effects"}, {"slug": "koncepciya-scenarij", "title": "Концепция и сценарий", "mod": "Недели 5–6 · Идея и раскадровка"}, {"slug": "referensy", "title": "Работа с референсами", "mod": "Недели 5–6 · Идея и раскадровка"}, {"slug": "raskadrovka", "title": "Раскадровка", "mod": "Недели 5–6 · Идея и раскадровка"}, {"slug": "montazh", "title": "Монтаж: склейки, переходы, крупности", "mod": "Недели 7–10 · Ролик"}, {"slug": "razgovornoe-video", "title": "Разговорное видео", "mod": "Недели 7–10 · Ролик"}, {"slug": "zvuk-i-ritm", "title": "Саунд-дизайн и визуальный ритм", "mod": "Недели 7–10 · Ролик"}, {"slug": "nejroseti-v-moushne", "title": "Нейросети в моушне", "mod": "Недели 11–12 · Финал"}, {"slug": "diplom", "title": "Дипломный проект и портфолио", "mod": "Недели 11–12 · Финал"}, {"slug": "lichnyj-brend", "title": "Личный бренд дизайнера", "mod": "Недели 11–12 · Финал"}];
  const END="%%END_SCRIPT%%";
  const $=s=>document.querySelector(s);
  const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  let done=store.get('mtm-done',{}), notes=store.get('mtm-notes',{}), cur=null;
  const items=[...document.querySelectorAll('.it')];
  function progress(){
    const n=ORDER.filter(o=>done[o.slug]).length;
    $('#pbar').style.width=(n/ORDER.length*100)+'%'; $('#ptxt').textContent='Прочитано '+n+' из '+ORDER.length;
    items.forEach(b=>b.classList.toggle('done',!!done[b.dataset.slug]));
  }
  function open(slug){
    const i=ORDER.findIndex(o=>o.slug===slug); if(i<0)return; cur=ORDER[i];
    $('#view').src='../'+slug+'/';
    items.forEach(b=>b.setAttribute('aria-current',String(b.dataset.slug===slug)));
    $('#pick').value=slug; $('#cur-mod').textContent=cur.mod; $('#cur-t').textContent=cur.title;
    $('#done').setAttribute('aria-pressed',String(!!done[slug])); $('#done').textContent=done[slug]?'Прочитано ✓':'Отметить прочитанным';
    $('#ntext').value=notes[slug]||'';
    $('#prev').disabled=i===0; $('#next').disabled=i===ORDER.length-1;
    store.set('mtm-cur',slug);
    try{history.replaceState(null,'','#'+slug)}catch(e){}
  }
  items.forEach(b=>b.addEventListener('click',()=>open(b.dataset.slug)));
  $('#pick').addEventListener('change',e=>open(e.target.value));
  $('#prev').addEventListener('click',()=>{const i=ORDER.indexOf(cur);if(i>0)open(ORDER[i-1].slug)});
  $('#next').addEventListener('click',()=>{const i=ORDER.indexOf(cur);if(i<ORDER.length-1)open(ORDER[i+1].slug)});
  $('#done').addEventListener('click',()=>{done[cur.slug]=!done[cur.slug];store.set('mtm-done',done);progress();$('#done').setAttribute('aria-pressed',String(!!done[cur.slug]));$('#done').textContent=done[cur.slug]?'Прочитано ✓':'Отметить прочитанным'});
  $('#nbtn').addEventListener('click',()=>{const o=$('#notes').classList.toggle('open');$('#nbtn').setAttribute('aria-expanded',String(o))});
  $('#ntext').addEventListener('input',e=>{notes[cur.slug]=e.target.value;store.set('mtm-notes',notes)});
  progress();
  const h=(location.hash||'').slice(1);
  open(ORDER.some(o=>o.slug===h)?h:store.get('mtm-cur',ORDER[0].slug));
})();
</script>

</body>
</html>
