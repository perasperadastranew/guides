<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Методички Mission to Web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Методички в дизайн-системе школы: тёмные панели-слайды на поле #1c1c1c, моно-уголки, оранжевый акцент. Одна методичка = одна длинная колонка без внутреннего скролла (встраивается по #id). */
:root{
  color-scheme:dark;
  --field:#1c1c1c; --panel:#101010; --card:#191919; --stroke:#2a2a2a; --well:#222;
  --ink:#f4f4f2; --dim:#8e8e8c; --faint:#5a5a58;
  --accent:#eb7540; --accent-ink:#101010;
  --good:#34c759; --bad:#ff3b4e;
  --display:-apple-system,"SF Pro Display","Onest","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,"SF Pro Text","Onest","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--field);color:var(--dim);font-family:var(--body);font-size:17px;line-height:1.45;margin:0;padding:16px 16px 120px}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;color:var(--ink);text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(38px,7vw,80px);line-height:.95}
h2{font-size:clamp(28px,4.4vw,46px);line-height:1}
h3{font-size:22px;line-height:1.15;letter-spacing:-.01em}
p{margin:0;max-width:62ch}
b,strong{font-weight:500;color:var(--ink)}
a{color:var(--ink)}
.mono,.corner,.k,.n,.qn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-style:normal}

.panel{background:var(--panel);border-radius:14px;padding:22px 26px 30px;display:flex;flex-direction:column;gap:20px;min-width:0}
.corner{display:flex;justify-content:space-between;gap:16px;margin-bottom:22px}
.corner span{white-space:pre-line;line-height:1.35}
.corner span:last-child{text-align:right}
.corner a{color:var(--faint);text-decoration:none}.corner a:hover{color:var(--ink)}
.hero{padding-bottom:36px;background-image:radial-gradient(#262626 1.2px,transparent 1.3px);background-size:18px 18px}
.lead{font-size:clamp(19px,2.4vw,26px);line-height:1.25;color:var(--dim);max-width:40ch;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--card);border:1px solid var(--stroke);border-radius:6px;padding:7px 10px;color:var(--dim)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* оглавление */
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.toc a{background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:12px 12px 14px;text-decoration:none;color:var(--ink);font-size:16px;line-height:1.2;display:flex;flex-direction:column;gap:18px;min-height:110px;justify-content:space-between}
.toc a .n{color:var(--dim);background:#262626;border-radius:6px;padding:5px 7px;align-self:flex-start}
.toc a small{font-size:13px;color:var(--dim)}
.toc a:hover,.toc a:focus-visible{border-color:var(--accent);outline:none}
.toc-block{display:flex;flex-direction:column;gap:12px}
.toc-block+.toc-block{margin-top:14px}

ul.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.dots li{padding-left:22px;position:relative;color:var(--ink);font-size:17px;max-width:70ch}
ul.dots li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--faint)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card b{font-size:18px;font-weight:400;line-height:1.2}
.card span{font-size:15px;line-height:1.4}
.card .k{color:var(--accent)}

.vis{display:flex;flex-direction:column;gap:12px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:f}
.flow li{counter-increment:f;background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:112px}
.flow li::before{content:counter(f,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--accent)}
.flow b{font-size:17px;font-weight:400;line-height:1.2}
.flow span{font-size:13.5px;line-height:1.35}
.scale{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);border-top:1px solid var(--stroke)}
.scale>*{padding:12px 0;border-bottom:1px solid var(--stroke);font-size:16px}
.scale dt{color:var(--ink);padding-right:14px}
.scale dd{margin:0}

.pairs{display:flex;flex-direction:column;gap:14px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pair>div{background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pair .bad .k{color:var(--bad)} .pair .good .k{color:var(--good)}
.pair span{font-size:16px;color:var(--ink);line-height:1.4}
.why{font-size:14px;line-height:1.4;border-left:1px solid var(--faint);padding-left:12px;max-width:70ch}

ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;align-items:start;color:var(--ink);font-size:17px}
ol.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--stroke);border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
ol.steps li span{padding-top:6px}

.ai{border:1px solid var(--accent);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ai .k{color:var(--accent)}
.ai ul.dots li::before{background:var(--accent)}

.task{border:1px solid var(--accent);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.task .k{color:var(--accent)}
.task>b{font-size:21px;font-weight:400;line-height:1.25}
.check{display:flex;flex-direction:column;border-top:1px solid var(--stroke)}
.check label{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid var(--stroke);cursor:pointer;align-items:start;color:var(--ink);font-size:16px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.check input:checked+span{color:var(--faint);text-decoration:line-through}

.q{background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.q .qn{color:var(--accent)}
.q .p{color:var(--ink);font-size:19px;line-height:1.3;max-width:56ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:400 16px var(--body);text-align:left;background:var(--well);color:var(--ink);border:1px solid var(--stroke);border-radius:8px;padding:11px 14px;line-height:1.35;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--accent);outline:none}
.opt:disabled{cursor:default;color:var(--dim)}
.opt .ex{font-size:14.5px;color:var(--dim);display:none}
.opt.shown .ex{display:block}
.opt.right{border-color:var(--good);color:var(--ink)}
.opt.wrong{border-color:var(--bad);color:var(--ink)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font:500 15px var(--body);background:var(--ink);color:var(--panel);border:0;border-radius:10px;padding:11px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--stroke);font-weight:400}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.big{font-family:var(--display);font-size:44px;line-height:1;color:var(--ink);letter-spacing:-.03em}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pager a{background:var(--panel);border-radius:14px;padding:18px 22px;text-decoration:none;display:flex;flex-direction:column;gap:6px;color:var(--ink);font-size:17px}
.pager a:hover{outline:1px solid var(--accent)}
.pager .next{text-align:right;grid-column:2}
footer{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 8px 0}
body.embed .back,body.embed .pager{display:none}

/* клавиши */
kbd{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:26px;height:26px;padding:0 7px;margin:0 1px;vertical-align:.08em;font:500 12.5px/1 var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);background:linear-gradient(#2c2c2c,#1f1f1f);border:1px solid #3a3a3a;border-bottom-width:3px;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);white-space:nowrap}
kbd .sym{font-family:var(--body);font-size:13px;color:var(--dim)}
.combo{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;vertical-align:baseline}
.combo .pl{font-family:var(--mono);font-size:11px;color:var(--accent)}
.combo .w{font-size:.92em;color:var(--dim)}
.keys{display:flex;flex-direction:column;border-top:1px solid var(--stroke);margin-top:4px}
.keys div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--stroke)}
.keys div>span:last-child{font-size:14px;color:var(--dim);line-height:1.3;text-align:right;flex:1 1 110px}
.keys div>span:first-child{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:0 1 auto}
.cards.shortcuts{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

@media (max-width:760px){
  .panel{padding:18px 16px 24px}
  .pair{grid-template-columns:minmax(0,1fr)}
  .scale{grid-template-columns:minmax(0,1fr)} .scale dt{border-bottom:0;padding-bottom:0}
  .pager{grid-template-columns:1fr}.pager .next{grid-column:1}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

/* возврат к календарю: крупная кнопка внизу экрана */
.tocal{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:inline-flex;align-items:center;gap:10px;
  background:var(--accent);color:var(--accent-ink);text-decoration:none;font:500 16px var(--body);border-radius:12px;padding:14px 22px;
  box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 6px rgba(28,28,28,.85);white-space:nowrap}
.tocal:hover{filter:brightness(1.06)}
.tocal:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tocal svg{width:18px;height:18px;flex:none}
@media (max-width:760px){.tocal{left:16px;right:16px;transform:none;justify-content:center}}
</style>
</head>

<script>
const DATA=[{"id": "creative-methods-concept", "block": "concept", "order": 1, "title": "Креативные методологии: как придумать концепцию", "lead": "Концепция не приходит «по вдохновению», её собирают по шагам. Теперь у тебя есть метод: от позиционирования бренда к ассоциациям, метафорам и одной сильной идее.", "time": "", "covered": ["Путь к концепции: позиционирование, ассоциации, метафоры, референсы, мудборд", "Иерархия системы: надсистема, система, подсистема, внешняя среда", "Четыре уровня восприятия: визуальный, эмоциональный, качественный, функциональный", "Виды образов: метонимия, метафора, расширенная метафора", "Фильтр метафор: консистентность, понятность, масштабируемость и «Понятнометр»", "Типичные ошибки при работе с концепцией"], "remember": [{"t": "Сначала бизнес, потом образ", "d": "Опиши продукт, аудиторию, атрибуты, преимущества и характер бренда. Метафору не выдумывают из воздуха, её подбирают под позиционирование."}, {"t": "Позиционирование отвечает «что рисуем», характер — «как это выглядит»", "d": "Преимущество подсказывает образ, а прилагательные характера (дружелюбный, строгий, тёплый) становятся критериями для шрифта, цвета и графики."}, {"t": "Иерархия системы даёт сырьё", "d": "Система — сам продукт, подсистема — его части, надсистема — то, куда он входит, внешняя среда — где он существует. Каждый уровень даёт новые ассоциации."}, {"t": "Уровни восприятия превращают ассоциации в метафоры", "d": "Спроси про предмет: как выглядит, как ощущается, какими качествами обладает, чем помогает. Застрял на одном уровне — переходи на другой."}, {"t": "Метафора — это сравнение по общему сходству", "d": "Шаблон: [продукт] [качество] как [сравнение]. Например, доставка быстрая, как страус."}, {"t": "Устрой гонку между концепциями", "d": "Генерируй много вариантов и фильтруй: из 30 понравившихся 10 подходят бренду, 5 понятны аудитории, 2 легко масштабируются."}, {"t": "Держись между банальным и непонятным", "d": "«Понятнометр»: слева очевидность, справа тайна. Хорошая метафора узнаётся сразу, но не скучная."}], "visual": {"type": "flow", "title": "Как придумать концепцию", "items": [{"t": "Позиционирование", "d": "Продукт, аудитория, атрибуты, преимущества, характер"}, {"t": "Подбор ассоциаций", "d": "Иерархия системы: над-, под-, система и внешняя среда"}, {"t": "Генерация метафор", "d": "Четыре уровня восприятия по каждой ассоциации"}, {"t": "Фильтр", "d": "Консистентность, понятность, масштабируемость: 30 → 10 → 5 → 2"}, {"t": "Поиск референсов", "d": "Картинки, которые показывают саму метафору"}, {"t": "Мудборд", "d": "Одна концепция = один слайд с названием, описанием и референсами"}]}, "goodbad": [{"bad": "Придумывать концепцию «с чистого листа» в полном хаосе", "good": "Пройти методику: позиционирование, иерархия системы, уровни восприятия", "why": "Методика даёт десятки вариантов за час и не зависит от вдохновения."}, {"bad": "Остановиться на первой идее, которая понравилась", "good": "Набрать 20–30 метафор и прогнать их через три фильтра", "why": "Первая идея чаще всего самая банальная — она лежит на «кольцевой банальностей»."}, {"bad": "Взять метонимию «в лоб»: для риелтора — крыша дома", "good": "Найти сравнение, которое передаёт преимущество, или оригинально обыграть часть целого", "why": "Метонимия — самый простой приём, без доработки он выглядит как у всех."}, {"bad": "Отправить заказчику концепцию текстом в мессенджер", "good": "Упаковать в слайд с референсами и ёмким описанием и защитить лично на созвоне", "why": "Без твоего рассказа заказчик не увидит идею за картинками. Крайний вариант — записать видео с пояснением."}], "steps": ["Заполни шаблон позиционирования: продукт, аудитория, атрибуты, преимущества, характер.", "Распиши иерархию системы: что входит в продукт, во что входит он сам, где он существует.", "По каждой сильной ассоциации пройди четыре уровня восприятия и запиши по 2–3 сравнения.", "Собери список из 20–30 метафор и отфильтруй: подходит бренду, понятна аудитории, масштабируется.", "Оставь 2–3 финалиста, сформулируй каждую по шаблону «[продукт] [качество] как [сравнение]».", "Оформи каждую концепцию отдельным мудбордом и презентуй голосом, а не текстом."], "ai": ["Правило школы: сначала выпиши свои ассоциации и метафоры сам, и только потом подключай нейросеть. Иначе получишь средние идеи, а не свои.", "Отдай агенту шаблон позиционирования и попроси расписать ассоциации по иерархии систем: надсистема, система, подсистема, внешняя среда. Сравни со своим списком и добавь недостающее.", "Попроси сгенерировать метафоры на 4 уровнях восприятия для твоих ассоциаций, а затем оценить топ-5 по консистентности, понятности и масштабируемости с коротким обоснованием.", "Финальный выбор делаешь ты: нейросеть не знает заказчика и легко уходит в банальное. Проверь каждую идею на «Понятнометре» сам."], "quiz": [{"q": "Что в методике школы идёт первым шагом?", "options": ["Поиск референсов на Pinterest", "Позиционирование бренда", "Генерация метафор"], "correct": 1, "explain": ["Референсы ищут уже под выбранную метафору, иначе подбор будет случайным.", "Верно: продукт, аудитория, атрибуты, преимущества и характер определяют, что и как рисовать.", "Метафоры генерируют из ассоциаций, а ассоциации — из понимания бизнеса."]}, {"q": "Ты делаешь концепцию для кофейни. Стаканчик кофе, зёрна и бариста — это какой уровень иерархии системы?", "options": ["Подсистема — составные части", "Надсистема — то, куда входит продукт", "Внешняя среда"], "correct": 0, "explain": ["Верно: это части, из которых состоит система «кофейня».", "Надсистема — то, во что кофейня входит: сеть, улица, район.", "Внешняя среда — пространство вокруг: город, утро, ритм жизни."]}, {"q": "Метафора «доставка быстрая, как страус» отлично подходит бренду, но аудитория её не считывает. Какой фильтр она не прошла?", "options": ["Консистентность", "Масштабируемость", "Понятность"], "correct": 2, "explain": ["Консистентность пройдена: метафора отражает преимущество — скорость.", "Масштабируемость — про то, мо заМКАДьем непонимания»", "Как можно дальше от темы"], "correct": 1, "explain": ["В центре — сама тема, рядом с ней всё очевидно.", "Верно: там образы и узнаваемые, и свежие.", "Далеко от темы — «заМКАДье непонимания», аудитория не считает образ."]}, {"q": "Креативную концепцию в шаблоне пишешь одной фразой. Какая подходит?", "options": ["Яркий, современный и запоминающийся дизайн", "Синие и оранжевые цвета, гротескный шрифт", "Как у Apple, только для пекарни", "Каршеринг свободный, как ветер"], "correct": 3, "explain": ["Это пожелания к результату, в них нет образа.", "Это стилистика: цвет и шрифт, а не метафора.", "Это копирование чужого стиля, а не своя идея.", "Верно: [продукт] [качество] как [сравнение]."]}], "task": {"title": "Задание: мудборды для трёх компаний", "time": "2–4 часа", "steps": ["Выбери три продукта или компании. Направления: магазин, приложение, услуги, производство или доставка чего угодно (5–10 минут).", "Заполни шаблон позиционирования для каждой: продукт, аудитория, атрибуты, преимущества, характер (5–10 минут).", "Разберись в видах образов на примерах: метонимия, метафора, расширенная метафора (5 минут).", "Выпиши ассоциации по иерархии системы: система — продукт, подсистема — его части, надсистема — то, куда он входит, внешняя среда — где существует (5–10 минут).", "В конструкторе «Карта метафоры» распиши метафоры на четырёх уровнях восприятия: визуальном, эмоциональном, качественном, функциональном (30 минут).", "Выбери лучшую идею по консистентности, понятности и масштабируемости, заполни шаблон концепции: название, креативная концепция, описание, ключевые слова (60 минут).", "Подбери референсы, которые показывают саму метафору, и собери из них мудборд для каждой из трёх концепций.", "Продублируй файл задания себе, добавь в название имя и фамилию и сдай куратору."], "check": ["Дизайн-концепция сильнее бизнес-идеи: компании обычные, а образ яркий.", "Одна концепция = одна метафора, без смешения образов.", "В каждой концепции есть конкретный образ, а не только стиль.", "Креативная концепция сформулирована в одну фразу: «[продукт] [качество] как [сравнение]».", "Метафора отражает преимущества бренда, понятна аудитории и масштабируется на носители.", "Референсы — иллюстрации и 3D под метафору, а не фото реальной деятельности."]}}, {"id": "figma-basics", "block": "figma", "order": 1, "title": "Основы Figma", "lead": "Figma — твой главный рабочий стол. После практикума ты двигаешься по холсту, выделяешь, выравниваешь и собираешь макет руками и шорткатами, а не через меню.", "time": "", "covered": ["Управление холстом: масштаб, лупа, быстрый переход к объектам, отмена действий", "Выделение и перемещение: Shift, область, Ctrl/Cmd для объектов внутри групп, точный сдвиг стрелками", "Фигуры, перо, размеры, скругления, фреймы и группы, Constraints", "Выравнивание и равномерное распределение объектов", "Текст: гарнитура, начертание, интерлиньяж, трекинг, Auto Height, перенос стилей", "Изображения (Fill, Fit, Crop, Tile), цвет и градиенты, сетки, плагины"], "remember": [{"t": "Сначала шорткат, потом мышь", "d": "Скорость в Figma — это руки на клавиатуре. Меню нужно только чтобы найти команду и запомнить её клавишу."}, {"t": "Фрейм — не группа", "d": "Фрейм (F) — контейнер со своими размерами, сеткой и Constraints. Группа (Ctrl/Cmd + G) просто связывает объекты и подстраивается под них."}, {"t": "Ctrl/Cmd — ключ внутрь", "d": "С зажатым Ctrl/Cmd клик или рамка выделения достают объект изнутри группы, не трогая её целиком."}, {"t": "Текст — на Auto Height", "d": "Фиксированный текстовый блок обрезает и ломает вёрстку. Двойной клик по правой границе переключает блок обратно в Auto Width."}, {"t": "Стиль переносится отдельно от текста", "d": "Ctrl/Cmd + Alt/Opt + C и V копируют только оформление: шрифт, размер, цвет. Контент остаётся прежним."}, {"t": "Сетка до первого элемента", "d": "Десктоп: 1440 px, 12 колонок, gutter 20 px, поля 50–150 px. Мобильный: 320–360 px, 4 колонки, gutter 16 px, поля 16–20 px."}], "visual": {"type": "grid", "title": "Шорткаты, которые нужны каждый день", "items": [{"t": "Холст", "d": "Shift + 1 — показать всё · Shift + 2 — к выделенному · Z — лупа · Ctrl/Cmd + +/- — масштаб"}, {"t": "Выделение", "d": "Ctrl/Cmd + A — всё · Shift + клик — добавить/убрать · Ctrl/Cmd + клик — внутрь группы"}, {"t": "Создание", "d": "F — фрейм · R — прямоугольник · O — круг · L — линия · P — перо · T — текст"}, {"t": "Копии", "d": "Ctrl/Cmd + D — дубль на месте · Alt/Opt + перетаскивание — копия · Ctrl/Cmd + Alt/Opt + C/V — стиль"}, {"t": "Выравнивание", "d": "Alt/Opt + A/D — по левому/правому краю · W/S — по верху/низу · H/V — по центру"}, {"t": "Слои", "d": "Ctrl/Cmd + [ или ] — ниже/выше · + Alt/Opt — в самый низ/верх · Ctrl/Cmd + R — переименовать"}, {"t": "Размер и форма", "d": "Shift — пропорционально · Alt/Opt — от центра · K — масштаб вместе с обводкой и скруглениями · Shift + H/V — отразить"}, {"t": "Группы", "d": "Ctrl/Cmd + G — сгруппировать · Ctrl/Cmd + Shift + G — разгруппировать · Ctrl/Cmd + Z — отменить"}]}, "goodbad": [{"bad": "Тянешь элементы на глаз и проверяешь отступы линейкой", "good": "Зажимаешь Alt/Opt и наводишь на соседний объект — Figma сама показывает расстояние в пикселях", "why": "Точные отступы — основа аккуратного макета, а не «почти ровно»."}, {"bad": "Растягиваешь картинку за угол, и она искажается", "good": "Ставишь изображение заливкой фрейма в режиме Fill или Crop, масштабируешь с Shift", "why": "Fill заполняет блок без искажений, Fit показывает картинку целиком, Tile повторяет паттерн."}, {"bad": "Слои называются Rectangle 12 и Frame 48", "good": "Сразу называешь блоки по смыслу через Ctrl/Cmd + R: header, card, button", "why": "В чужом или своём старом макете без имён ничего не найти, а Ctrl/Cmd + F ищет по названиям."}, {"bad": "Кладёшь элемент поверх фрейма, но он остаётся на холсте", "good": "Перетаскиваешь элемент внутрь границ фрейма и проверяешь вложенность в панели слоёв", "why": "Элемент вне фрейма не двигается с ним, не попадает в экспорт и не слушается Constraints."}], "steps": ["Сделай копию практикума к себе (Duplicate to your drafts) и проходи уровни по порядку, не перескакивая.", "Выпиши на стикер 10 шорткатов из этой методички и держи рядом с клавиатурой неделю.", "Каждый новый макет начинай с фрейма нужного размера и сетки: десктоп 1440 px / 12 колонок или мобильный 360 px / 4 колонки.", "Задай текстовые стили (H1, H2, H3, текст, описание) один раз и переноси их через Ctrl/Cmd + Alt/Opt + C/V.", "Перед сдачей пройдись по слоям: всё внутри фреймов, слои названы, текстовые блоки на Auto Height."], "ai": ["Практикум — это моторика: нейросеть не выделит объекты и не выровняет их за тебя. Пальцы должны запомнить шорткаты сами.", "Застрял на шаге — сделай скриншот панели Figma и спроси Claude или ChatGPT, какая настройка за что отвечает и где её найти.", "Попроси нейросеть собрать персональную шпаргалку шорткатов под твою ОС (Mac или Windows) и распечатай её.", "Проверяй ответы на практике: интерфейс Figma обновляется, и нейросеть может описать старое расположение кнопок."], "quiz": [{"q": "Нужно выделить маленький квадрат, который лежит внутри группы. Что сделать?", "options": ["Разгруппировать всё через Ctrl/Cmd + Shift + G", "Кликнуть по квадрату с зажатым Ctrl/Cmd", "Нажать Ctrl/Cmd + A"], "correct": 1, "explain": ["Сработает, но ты сломаешь структуру группы ради одного выделения.", "Верно: Ctrl/Cmd позволяет выделить объект внутри группы, не разбирая её.", "Ctrl/Cmd + A выделяет все объекты, а не один конкретный."]}, {"q": "Чем фрейм отличается от группы?", "options": ["Ничем, это два названия одного и того же", "Группа может иметь сетку, а фрейм нет", "Фрейм — контейнер со своими размерами, сеткой и Constraints, группа просто подстраивается под объекты"], "correct": 2, "explain": ["Это разные сущности с разным поведением при изменении размера.", "Наоборот: сетку (Layout Grid) можно добавить только фрейму.", "Верно: фрейм задаёт границы и правила, группа лишь объединяет объекты."]}, {"q": "Какой режим заливки изображения показывает картинку целиком, без обрезки?", "options": ["Fit", "Fill", "Tile"], "correct": 0, "explain": ["Верно: Fit вписывает изображение так, чтобы его было видно полностью.", "Fill заполняет весь блок и при необходимости обрезает края.", "Tile повторяет изображение копиями, как паттерн."]}, {"q": "Нужно проверить, что между двумя карточками ровно столько пикселей, сколько в задании. Как быстрее всего?", "options": ["Подложить между ними прямоугольник нужной ширины", "Вычесть координаты X в правой панели", "Выделить карточку, зажать Alt/Opt и навести на соседнюю", "Включить сетку и посчитать колонки"], "correct": 2, "explain": ["Это та же проверка «линейкой» — медленно и легко ошибиться.", "Сработает, но это долго, а в ширине карточки легко запутаться.", "Верно: с Alt/Opt Figma сама показывает расстояние до соседнего объекта в пикселях.", "Сетка показывает колонки, а не расстояние между конкретными объектами."]}, {"q": "Найди то, что НЕ является ошибкой в макете студента.", "options": ["Картинка в карточке растянута за угол и искажена", "Текст в блоке обрезан снизу", "Слои названы header, card и button"], "correct": 2, "explain": ["Ошибка: изображение ставят заливкой в режиме Fill или Crop и масштабируют с Shift.", "Ошибка: текстовый блок нужно перевести в Auto Height.", "Верно: так и надо — по смысловым именам слой легко найти, в том числе через Ctrl/Cmd + F."]}, {"q": "Ты хочешь сделать копию кнопки ровно на том же месте, чтобы потом сдвинуть её стрелками. Какой шорткат?", "options": ["Ctrl/Cmd + G", "Ctrl/Cmd + R", "Alt/Opt + A", "Ctrl/Cmd + D"], "correct": 3, "explain": ["Ctrl/Cmd + G группирует выделенные объекты.", "Ctrl/Cmd + R переименовывает слой.", "Alt/Opt + A выравнивает по левому краю.", "Верно: Ctrl/Cmd + D делает дубль на месте."]}, {"q": "Почему плохо, когда элемент лежит поверх фрейма, но в панели слоёв находится не внутри него?", "options": ["Ничего страшного, просто слои выглядят неаккуратно", "Он не двигается с фреймом, не попадает в экспорт и не слушается Constraints", "Figma удалит его при следующем сохранении"], "correct": 1, "explain": ["Это не косметика: элемент реально выпадает из макета.", "Верно: для Figma он лежит на холсте и с фреймом не связан.", "Figma ничего не удаляет сама — элемент просто останется на холсте."]}, {"q": "Ты добавил строку в описание, и текст обрезался снизу. Что поправить?", "options": ["Перевести текстовый блок в Auto Height", "Уменьшить кегль, пока текст не влезет", "Растянуть блок вручную с запасом"], "correct": 0, "explain": ["Верно: Auto Height сам подстраивает высоту блока под количество строк.", "Ты ломаешь типографику ради размера блока, а при следующей правке проблема вернётся.", "Фиксированный блок с запасом сломается при следующей правке текста."]}, {"q": "Подзаголовок в новом блоке должен выглядеть как в старом, но текст у него свой. Как перенести оформление?", "options": ["Скопировать старый подзаголовок через Ctrl/Cmd + D и перепечатать текст", "Ctrl/Cmd + Alt/Opt + C на старом, Ctrl/Cmd + Alt/Opt + V на новом", "Сгруппировать оба подзаголовка через Ctrl/Cmd + G"], "correct": 1, "explain": ["Сработает, но это лишняя работа, а при длинном тексте легко потерять контент.", "Верно: эта пара копирует только стиль — шрифт, размер, цвет, а текст остаётся прежним.", "Группа не переносит оформление, она только связывает объекты."]}, {"q": "Ты начинаешь мобильный макет. Какая сетка соответствует методичке?", "options": ["1440 px, 12 колонок, gutter 20 px", "360 px, 12 колонок, без полей", "320 px, 8 колонок, gutter 20 px", "360 px, 4 колонки, gutter 16 px, поля 16–20 px"], "correct": 3, "explain": ["Это сетка для десктопа.", "12 колонок на 360 px — слишком мелко, а без полей контент липнет к краям.", "8 колонок — это сетка каталога из практикума, а не мобильного экрана.", "Верно: мобильный — 320–360 px, 4 колонки, gutter 16 px, поля 16–20 px."]}], "task": {"title": "Практикум по Figma: три уровня", "time": "", "steps": ["Уро ap и padding — разные вещи", "d": "Интервал (gap) — расстояние между объектами. Отступ (padding) — от объектов до краёв контейнера."}, {"t": "Шаг кратности", "d": "Отступы и интервалы делай кратными одной единице: в вебе часто 10 px, в приложениях удобнее 4 px."}, {"t": "Fixed, Hug, Fill", "d": "Fixed — размер задан вручную. Hug — контейнер обнимает содержимое. Fill — ребёнок растягивается на всё место у родителя."}, {"t": "Auto gap разносит по краям", "d": "Интервал Auto ставит элементы к краям контейнера, как логотип и меню в шапке или иконки в тапбаре."}, {"t": "Absolute position — для исключений", "d": "Бейдж «-20%» или тег поверх карточки выводим из потока абсолютным позиционированием, а не ломаем автолейаут."}, {"t": "Выравнивание по левому краю и по центру", "d": "Эти два варианта закрывают около 90% задач. Остальные — осознанно и редко."}], "visual": {"type": "grid", "title": "Направление автолейаута: что чем собирать", "items": [{"t": "Vertical", "d": "Карточка, таблица, форма, сайдбар — всё, что идёт сверху вниз"}, {"t": "Horizontal", "d": "Навигация, тапбар, карусель карточек, истории, кнопка с иконкой"}, {"t": "Wrap", "d": "Набор тегов и фильтров, сетка карточек — элементы переносятся на новую строку"}, {"t": "Absolute", "d": "Бейджи, теги, счётчики поверх других элементов — вне общего потока"}]}, "goodbad": [{"bad": "Кнопка с фиксированной шириной: длинный текст вылезает за края", "good": "Кнопка в Hug × Hug с горизонтальным и вертикальным padding", "why": "Hug подстраивает кнопку под текст, а отступы остаются одинаковыми."}, {"bad": "Поля формы в Fixed: при растягивании формы они остаются узкими", "good": "Поля и кнопка в Fill по ширине внутри формы", "why": "Fill заставляет детей занимать всю ширину родителя, и форма адаптируется."}, {"bad": "Бейдж скидки сдвигает весь контент карточки вниз", "good": "Бейджу включено абсолютное позиционирование, он закреплён в углу", "why": "Абсолютный элемент не участвует в потоке и не толкает соседей."}, {"bad": "От h) элементов без причины", "Главные компоненты собраны в одном месте"]}}, {"id": "references-search-select-adapt", "block": "refs", "order": 1, "title": "Референсы: искать, отбирать, адаптировать", "lead": "Хороший макет начинается не с чистого листа, а с правильно подобранных референсов. Теперь ты умеешь искать их под задачу блока, отсеивать лишнее и адаптировать без копирования.", "time": "", "covered": ["Зачем нужны референсы и почему без них получается банальный дизайн", "Тройной фильтр: смысл блока, объём контента, визуальный ритм", "Сколько референсов нужно на блок и на весь макет", "Четыре частые ошибки адаптации: пустой реф, неактуальный дизайн, передизайн, «блок мимо»"], "remember": [{"t": "Без референса получается банально", "d": "Если рисовать блок из головы, выйдет либо самый очевидный вариант, либо копия соседнего блока в твоём же проекте."}, {"t": "Качество дизайна = количество референсов", "d": "На блок нужно 5–7 сильных референсов, на макет из 7–10 блоков — 60–100. Новичку нужно перебрать даже больше, это нормально."}, {"t": "Из 100 понравившихся остаётся 10", "d": "Из 100 референсов примерно 30 подойдут по смыслу и только 10 — по ритму всего макета. Отсев — часть работы, а не потеря времени."}, {"t": "У каждого референса есть основа", "d": "Найди, на чём держится реф: крупная фотография, контраст шрифтов, ритм карточек. Если её упростить, реф перестанет работать."}, {"t": "Менять рефы по ходу — нормально", "d": "На вайрфрейме и в дизайне ты увидишь, что какой-то блок не встаёт. Замени референс, а не ломай композицию."}, {"t": "Смешивай рефы разной сложности", "d": "Нужен баланс коммерческого и концептуального дизайна: пара смелых решений на фоне спокойных блоков, а не десять «вау» подряд."}, {"t": "Не бери рефы с сайта школы", "d": "Работы и блоки с сайта школы и из её библиотеки блоков копировать нельзя. Собирай свою базу и согласовывай её с куратором."}], "visual": {"type": "flow", "title": "Фильтр референсов", "items": [{"t": "100 понравились", "d": "Собираешь всё, что цепляет, с Awwwards, land-book, godly, Pinterest, постеров и полиграфии"}, {"t": "30 по смыслу", "d": "Реф решает ту же задачу блока и вмещает твой объём контента"}, {"t": "10 по ритму", "d": "Реф сочетается с остальными блоками и держит общий ритм макета"}, {"t": "5–7 на блок", "d": "Оцениваешь каждый по трём критериям и выбираешь лучший"}, {"t": "3 варианта макета", "d": "Собираешь страницу из рефов в нескольких вариантах и смотришь издалека"}]}, "goodbad": [{"bad": "Взять первый эффектный шот с Dribbble, где в одну картинку засунули всё сразу", "good": "Брать живые сайты с понятной структурой блоков и умеренным количеством приёмов", "why": "Шоты для Dribbble делают ради одной картинки, это передизайн: он не переносится в настоящий лендинг."}, {"bad": "Выбрать реф, где весь блок держится на иллюстрации и почти нет текста", "good": "Сравнить объём контента в рефе со своим блоком и только потом решать", "why": "Пустой референс ничего не говорит о раскладке элементов. Под него придётся либо выкидывать свой текст, либо изобретать заново."}, {"bad": "Для блока отзывов искать только блоки отзывов, а нашёлся реф команды — выкинуть", "good": "Брать другой тип блока, если он подходит по смыслу: карточки преимуществ отлично показывают несколько отзывов", "why": "Важно не название блока, а задача: показать несколько равнозначных сущностей. А вот реф, не совпадающий по смыслу, — это «блок мимо»."}, {"bad": "Оставить реф как есть, со всеми отступами и шириной из чужого кейса", "good": "Масштабировать реф под ширину своего контейнера и подогнать под свои силовые линии и колонки", "why": "Тебе нужно устройство макета, а не то, как его оформили в кейсе. Иначе блоки не соберутся в одну страницу."}], "steps": ["Открой смысловой прототип и для каждого блока выпиши задачу, тип и объём контента.", "Определи стиль проекта по системе координат стилей: какое ощущение должен вызывать сайт.", "Собери на доске широкую подборку, затем прогони её через фильтр: смысл, контент, ритм. Оставь 5–7 рефов на блок.", "Отметь у каждого рефа, насколько он подходит, и подпиши его основу: на чём он держится.", "Подгони рефы под ширину своего контейнера и собери 2–3 варианта страницы целиком. Оцени ритм издалека: блоки должны отличаться, но держаться на одних силовых линиях.", "Покажи подборку куратору до вайрфрейма: сейчас он твой арт-директор."], "ai": ["Отдай Claude или ChatGPT смысловой прототип и попроси для каждого блока описать задачу, объём контента и 5–7 поисковых запросов на английском для Awwwards, land-book и Pinterest.", "Загрузи скриншот рефа и спроси: на чём держится композиция, какой объём текста он выдержит, какие материалы понадобятся (фото, иллюстрация, 3D). Это быстрая проверка на «пустой реф».", "Попроси нейросеть разобрать 3 собранных варианта страницы по ритму: где блоки повторяются, где нет смысловых пауз. Финальный выбор и вкус оставь себе и куратору."], "quiz": [{"q": "Тебе нужно сделать блок отзывов. Нашёлся сильный реф блока преимуществ с тремя карточками. Что делать?", "options": ["Отказаться: тип блока не совпадает", "Взять, если он решает ту же задачу — показать несколько равнозначных сущностей", "Взять и поменять отзывы на преимущества, чтобы совпало"], "correct": 1, "explain": ["Название блока не главное. Ошибка «блок мимо» — это реф, который не подходит по смыслу, а не по типу.", "Верно: карточки преимуществ и отзывы решают похожую задачу, поэтому такой реф можно адаптировать.", "Структуру задаёт смысловой прототип, а не найденный реф."]}, {"q": "Сколько референсов по композиции нужно собрать на макет из 7–10 блоков?", "options": ["10–15, по одному-два на блок", "60–100, примерно 5–7 на каждый блок", "Сколько угодно, главное — один идеальный сайт целиком"], "correct": 1, "explain": ["Одного-двух рефов мало: не из чего выбирать, и блок скорее всего выйдет банальным.", "Верно: качество дизайна напрямую зависит от количества референсов, которые ты перебрал.", "Копировать один сайт целиком — это не адаптация."]}, {"q": "Что такое «пустой референс»?", "options": ["Блок, где всё держится на графике, а о раскладке текста и элементов информации нет", "Реф с белым фоном и большим количеством воздуха", "Реф, который ты пока не подписал на доске"], "correct": 0, "explain": ["Верно: из такого рефа нельзя понять, как разложить твой контент, поэтому сначала сверяй объём контента.", "Много воздуха — это нормально. Пустота рефа — в отсутствии информации о композиции.", "«Пустой реф» — про содержание блока, а не про подписи на доске."]}, {"q": "На Dribbble нашёлся эффектный шот: в одном экране и 3D, и пять шрифтов, и сложная анимация. Брать его рефом?", "options": ["Да, чем эффектнее, тем лучше", "Да, но только первый экран", "Лучше взять живые сайты с понятной структурой и умеренным количеством приёмов"], "correct": 2, "explain": ["Шот делают ради одной картинки — в настоящий лендинг он не переносится.", "Проблема та же: это передизайн, а не устройство блока.", "Верно: передизайн с Dribbble — частая ошибка адаптации."]}, {"q": "Тебе очень понравился блок на сайте школы. Можно взять его референсом?", "options": ["Нет: работы и блоки с сайта школы и из её библиотеки блоков брать нельзя", "Да, если немного поменять цвета", "Да, сайт школы — проверенный пример"], "correct": 0, "explain": ["Верно: базу собираешь свою и согласовываешь с куратором.", "Перекраска не делает чужой блок твоим, а правило запрещает такие рефы.", "Именно поэтому его и нельзя копировать: это чужая готовая работа."]}, {"q": "Реф взят из чужого кейса: другая ширина контейнера и свои отступы. Что делать?", "options": ["Оставить как есть — так задумал автор", "Перерисовать блок с нуля без рефа", "Взять только цвета и шрифты", "Масштабировать под ширину своего контейнера и подогнать под свои силовые линии и колонки"], "correct": 3, "explain": ["Тогда блоки не соберутся в одну страницу.", "Реф нужен — его надо адаптировать, а не выбросить.", "Из рефа нужно устройство макета, а не оформление.", "Верно: тебе нужно устройство макета, а не оформление из кейса."]}, {"q": "Из 100 понравившихся рефов по смыслу подошли 30, а по ритму — только 10. Как к этому относиться?", "options": ["Это нормальный отсев — часть работы", "Значит, искал плохо — надо начинать заново", "Вернуть отсеянные — понравились же"], "correct": 0, "explain": ["Верно: из 100 понравившихся обычно и остаётся около 10.", "Это обычная пропорция, а не провал.", "Понравился — не значит подходит по смыслу и ритму."]}, {"q": "Ты подобрал на все блоки самые смелые концептуальные рефы. В чём риск?", "options": ["Риска нет: так сайт будет ярче", "Нужен баланс: пара смелых решений на фоне спокойных блоков", "Куратор не примет концептуальные рефы"], "correct": 1, "explain": ["Десять «вау» подряд перегружают и ломают ритм.", "Верно: смешивай рефы разной сложности.", "Смелые рефы нужны, проблема только в их количестве."]}, {"q": "На вайрфрейме выяснилось, что блок по выбранному рефу не встаёт в композицию. Что делать?", "options": ["Подогнать композицию всей страницы под этот реф", "Оставить как есть — реф ведь утвердили", "Заменить референс"], "correct": 2, "explain": ["Ради одного рефа ломать композицию — плохая сделка.", "Утверждённый реф всё равно можно менять, если он не работает.", "Верно: менять рефы по ходу — нормально."]}, {"q": "Реф держится на крупной фотографии, а ты вместо неё ставишь маленькую иконку. Что будет?", "options": ["Ничего страшного, композиция та же", "Станет только лучше: меньше визуального шума", "Реф перестанет работать: ты упростил его основу"], "correct": 2, "explain": ["Без основы композиция теряет смысл.", "Ты убираешь то, на чём держится блок.", "Верно: сначала найди основу рефа и сохрани её."]}], "task": {"title": "Подборка референсов для своего лендинга", "time": "", "steps": ["Для каждого блока смыслового прототипа собери 5–7 референсов, всего 60–100 на макет.", "Подпиши у каждого рефа основу и оценку: смысл, контент, ритм.", "Масштабируй рефы под ширину своего контейнера.", "Собери 2–3 варианта страницы из рефов и выбери лучший."], "check": ["У каждого блока есть 5–7 рефов, а не один-два", "Нет шотов с Dribbble, неактуального дизайна и пустых рефов", "Нет работ с сайта школы и из её библиотеки блоков", "Рефы разной сложности: есть и смелые, и спокойные блоки", "Блоки отличаются друг от друга, но вместе держат один ритм"]}}, {"id": "landing-six-stages", "block": "landing", "order": 1, "title": "Проект №1: шесть этапов лендинга", "lead": "Первый проект курса — лендинг от темы до упакованного кейса. Здесь вся дорога целиком: какие этапы, сколько на них уходит времени и что сдавать куратору.", "time": "", "covered": ["Шесть этапов проекта и примерное время на каждый", "Как устроена проверка: этап за этапом, через куратора", "Что получается на выходе каждого этапа", "Ключевые правила вайрфрейма, дизайна и адаптива", "Как вести проект с нейросетью: паспорт проекта и отдельный чат на этап"], "remember": [{"t": "Каждый этап сдаётся куратору", "d": "Следующий этап начинается только после проверки предыдущего. Ошибку в смысловом прототипе дешевле поправить сразу, чем переделывать готовый дизайн."}, {"t": "Проверок будет много", "d": "За проект набирается от 10 до 25 проверок. Концепцию, дизайн и кейс дополнительно смотрит Саша."}, {"t": "Стиль решается в самом начале", "d": "Частая ошибка первого этапа — не определиться со стилем. У тебя в голове должна быть примерная картина сайта до того, как ты пойдёшь за рефами."}, {"t": "Контент — основа дизайна", "d": "Классные макеты держатся на продуманном и сгруппированном контенте. Поэтому смысловой прототип идёт раньше, чем любая картинка."}, {"t": "Вайрфрейм только в сером", "d": "Палитра серого, один простой шрифт, 5–6 текстовых стилей. Цвет и выразительные шрифты появляются только на этапе дизайна."}, {"t": "Адаптив — это половина трафика", "d": "С телефона приходит около половины посетителей. Адаптив — не формальность, а отдельная работа по каждому блоку."}], "visual": {"type": "flow", "title": "Шесть этапов лендинга · в ые цвета", "Брутализм: капс и кислотный акцент"], "correct": 2, "explain": ["Playful — для сервисов для людей, детей, еды. Техничность он не передаёт.", "Ретро — про ивенты, музыку, кафе, а не про инфраструктуру.", "Верно: строгий стиль с системной детализацией — как раз для B2B и инфраструктуры.", "Брутализм креативный и провокационный, он скорее про культуру и смелые бренды."]}, {"q": "Найди ошибку. Сайт про Японию: палитра из японских гравюр, графика волн, каллиграфический шрифт в заголовках.", "options": ["Палитра из японских гравюр", "Графика волн", "Каллиграфический шрифт в заголовках", "Ошибки нет"], "correct": 2, "explain": ["Цвет — нормальный способ передать тему.", "Графика тоже работает на тему и может быть доминантой.", "Верно: тему лучше раскрывать композицией, цветом и графикой, а шрифт оставить читаемым.", "Есть: удачных кейсов с декоративным «национальным» шрифтом почти нет."]}, {"q": "Почему не стоит копировать понравившийся референс целиком?", "options": ["Стиль — набор маркеров, а готовый макет не подходит под твой контент и бренд", "Референсы быстро устаревают", "Заказчик всё равно попросит переделать"], "correct": 0, "explain": ["Верно: выписывай маркеры по пяти инструментам и собирай своё.", "Дело не в возрасте референса, а в том, что чужой макет решает чужую задачу.", "Это не причина. Копия плоха тем, что не отражает характер твоего бренда."]}, {"q": "Какой из пяти инструментов стиля чаще всего задаёт характер проекта?", "options": ["Композиция", "UI-элементы", "Цвет", "Графика"], "correct": 3, "explain": ["Наоборот: в большинстве стилей композиция довольно стандартная.", "Они поддерживают стиль (острые или мягкие), но редко задают его в одиночку.", "Цвет важен, но главный носитель характера обычно графика.", "Верно: характер чаще всего задаёт графика, остальное подстраивается под неё."]}, {"q": "Сервис доставки еды для семей хочет вызывать заботу и радость. Какое направление выбрать?", "options": ["Типографический: текст как главный визуал, ж для всего не работает."}, {"t": "Внутреннее меньше внешнего", "d": "Заголовок ближе к своему тексту, чем к предыдущему блоку. Мозг группирует элементы по близости."}, {"t": "Строка не шире ~700 px", "d": "Длинную строку глаз не охватывает и теряет переход на следующую. Выключка по левому краю, по ширине в вебе не используй."}, {"t": "Явное родство или явный контраст", "d": "Пара из «похожих, но разных» шрифтов выглядит как ошибка. Не больше 2–3 шрифтов и 3–4 начертаний на проект."}, {"t": "Шрифт по характеру и ограничениям", "d": "Сначала характер бренда, потом проверка: есть ли кириллица, какая лицензия, сколько начертаний грузит сайт."}], "visual": {"type": "scale", "title": "Пример шкалы текстов для лендинга", "items": [{"t": "H1", "d": "64 px · интерлиньяж 110% · заголовок первого экрана"}, {"t": "H2", "d": "32 px · 115–120% · заголовки блоков"}, {"t": "H3", "d": "20–24 px · 120% · заголовки карточек"}, {"t": "Текст", "d": "16–18 px · ~130% · наборный текст, строка до ~700 px"}, {"t": "Подпись", "d": "12–14 px · 130% · подписи, метки, вспомогательное"}]}, "goodbad": [{"bad": "H1 40 px, H2 34 px, текст 24 px", "good": "H1 64 px, H2 32 px, текст 16–18 px", "why": "Близкие размеры не создают иерархию, а крупный наборный текст съедает воздух в композиции."}, {"bad": "В одном заголовке меняются шрифт, цвет и размер сразу", "good": "Ключевое слово выделено одним приёмом: курсивом или другим начертанием", "why": "Больше двух стилей в заголовке превращаются в хаос."}, {"bad": "Пара из двух гротесков с похожими пропорциями", "good": "Одна гарнитура в разных начертаниях или явный контраст: антиква + гротеск", "why": "Слабое различие читается как техническая ошибка, а не как решение."}, {"bad": "Красивый латинский шрифт, кириллицу «потом найдём»", "good": "Кириллица и лицензия проверены до того, как шрифт попал в макет", "why": "Без кириллицы шрифт нельзя использовать, и стиль придётся пересобирать."}], "steps": ["Опиши проект тремя прилагательными и найди зону на шрифтовой оси: традиционные ↔ современные, акцидентные ↔ минималистичные.", "Выбери 2–3 кандидата, проверь кириллицу, лицензию и количество начертаний.", "Набери название бренда каждым шрифтом и зафиксируй первое ощущение до чтения.", "Собери шкалу: H1, H2, H3, текст, подпись. Соседние уровни отличаются заметно, интерлиньяж падает с ростом кегля.", "Сверстай один блок: проверь длину строки, выключку по левому краю и отступы «внутреннее меньше внешнего».", "Если нужен один эффектный заголовок вне системы, сделай его «фантомным» стилем, но только один раз и по смыслу."], "ai": ["Отдай нейросети характер бренда и попроси 5 шрифтовых пар с кириллицей из свободных библиотек, с объяснением, почему пара работает.", "Попроси рассчитать шкалу кеглей и интерлиньяжей под твой основной текст и проверить, что соседние уровни различаются достаточно.", "Дай текст блока и попроси сократить формулировку заголовка, если она ломает композицию.", "Финальный выбор шрифта делай сам на макете: нейросеть не видит, как буквы выглядят в твоей композиции."], "quiz": [{"q": "Основной текст 16 px. Какой интерлиньяж поставить заголовку 64 px?", "options": ["Такой же, как у текста: 130–150%", "Плотнее: около 110–120%", "Авто для всего, чтобы было одинаково"], "correct": 1, "explain": ["С таким интерлиньяжем крупный заголовок разваливается на отдельные строки.", "Верно: чем крупнее кегль, тем плотнее относительный интерлиньяж.", "Интерлиньяж — динамичная настройка, одно значение для всех размеров не работает."]}, {"q": "Какая выключка подходит для длинного текста на сайте?", "options": ["По ширине", "По центру", "По левому краю"], "correct": 2, "explain": ["Без ручных переносов по ширине появляются дыры между словами.", "По центру удобно только для коротких заголовков и обложек.", "Верно: глаз всегда находит начало строки в одном месте."]}, {"q": "Какая шрифтовая пара, скорее всего, будет выглядеть как ошибка?", "options": ["Два разных гротеска с похожими пропорциями и окончаниями", "Одна гарнитура в начертаниях Bold и Regular", "Антиква в заголовках и нейтральный гротеск в тексте"], "correct": 0, "explain": ["Верно: «похожи, но не одинаковы» — главный антипаттерн пар.", "Это самый безопасный вариант: явное родство.", "Это явный контраст, классическая рабочая пара."]}, {"q": "Бренд — строгая юридическая фирма: традиции, статус, надёжность. Как подойти к выбору шрифта?", "options": ["Взять акцидентный декоративный шрифт, чтобы выделиться", "Искать в зоне «традиционные» на шрифтовой оси, например антиква в заголовках и нейтральный гротеск в тексте", "Взять любой модный гротеск, характер задаст цвет"], "correct": 1, "explain": ["Яркий акцидентный шрифт спорит со строгостью и статусом.", "Верно: шрифт идёт от характера бренда, а антиква + гротеск — рабочая контрастная пара.", "Шрифт — один из главных носителей характера, его выбирают осознанно."]}, {"q": "Найди ошибку в шкале: H1 40 px, H2 34 px, текст 24 px.", "options": ["Ошибки нет, иерархию создают начертания", "H1 слишком крупный для лендинга", "Соседние уровни слишком близки, а 24 px многовато для наборного текста"], "correct": 2, "explain": ["Начертания помогают, но такие близкие размеры не читаются как разные уровни.", "Наоборот, H1 маловат: на первом экране заголовок может быть 64 px.", "Верно: делай разницу примерно в 2 раза (H1 64, H2 32) и текст 16–18 px."]}, {"q": "Почему заголовок ставят ближе к своему тексту, чем к предыдущему блоку?", "options": ["Мозг группирует элементы по близости и сразу понимает, что к чему относится", "Так экономится место на странице", "Этого требует 12-колоночная сетка"], "correct": 0, "explain": ["Верно: внутреннее меньше внешнего.", "Экономия места тут ни при чём, речь о группировке.", "Сетка задаёт колонки, а не отступы между заголовком и текстом."]}, {"q": "Найди ошибку. Ключевое слово в заголовке выделено другим шрифтом, другим цветом и увеличено.", "options": ["Ошибки нет, так акцент заметнее", "Ключевые слова в заголовке выделять нельзя", "Нужно было ещё и подчеркнуть", "С  до ширины экрана", "Каждую строку сделать отдельной карточкой", "Убрать таблицу из мобильной версии", "Оставить таблицу с горизонтальным скроллом"], "correct": 3, "explain": ["Текст станет нечитаемым.", "Карточки удобны для скорости чтения, но сравнивать в них тяжелее.", "Пользователь потеряет важную информацию.", "Верно: скролл — когда важно именно сравнение."]}, {"q": "На мобиле две иконки-кнопки 32×32 стоят вплотную друг к другу. Что исправить?", "options": ["Зону нажатия сделать не меньше 44×44 и развести элементы минимум на 8 px", "Увеличить только саму иконку до 44 px", "Ничего, на десктопе же работает"], "correct": 0, "explain": ["Верно: палец толще курсора.", "Важна зона нажатия, саму иконку раздувать не обязательно.", "На телефоне по ним будут промахиваться."]}, {"q": "На десктопе слева большое фото, справа заголовок, выгода и кнопка. Что идёт первым на мобиле?", "options": ["Фото — оно же стояло слева", "Заголовок, выгода и действие, фото — ниже", "Кнопка, а заголовок прячется в аккордеон"], "correct": 1, "explain": ["Порядок на мобиле задаёт важность, а не положение на десктопе.", "Верно: главное — наверх.", "Без заголовка непонятно, на что нажимать."]}, {"q": "Заказчик просит отдельный макет под горизонтальный планшет. Что ответишь по методичке?", "options": ["Нарисую — каждое устройство требует своего макета", "Это лишнее: есть 375, 768 и 1440, а промежутки разработчик закрывает резиной", "Отдам десктоп, уменьшенный на 30%"], "correct": 1, "explain": ["Устройств сотни, под каждое не рисуют.", "Верно: горизонтальный планшет отдельно не рисуем.", "Масштабирование — главная ошибка адаптива."]}, {"q": "При растягивании фрейма карточка не тянется, а кнопка внутри неё растягивается, хотя должна быть по размеру текста. Как настроить Auto Layout?", "options": ["Карточка — Hug, кнопка — Fill", "Обе — Fill", "Убрать Auto Layout и выставить размеры руками", "Карточка — Fill, кнопка — Hug"], "correct": 3, "explain": ["Ровно наоборот: так и получается описанная проблема.", "Кнопка всё равно растянется на всю карточку.", "Тогда на каждом брейкпоинте придётся всё править вручную.", "Верно: что тянется — Fill, что ужимается по содержимому — Hug."]}], "task": null}, {"id": "ui-kit", "block": "ui", "order": 8, "title": "UI-кит", "lead": "UI-кит — это система правил, по которой живёт интерфейс: стили текста, цвета, отступы и компоненты. Теперь ты умеешь видеть систему в чужом макете и собирать её в Figma.", "time": "", "covered": ["Зачем нужен UI-кит и как он связан с дизайн-системой и айдентикой", "Четыре части кита: типографика, цвет, отступы, UI-элементы", "Атомарный дизайн: атомы, молекулы, организмы, шаблоны", "Свойства компонентов: type, size, state, icon, theme", "Разница кита для сайта и для приложения", "Когда собирать кит: после утверждённого каркаса и визуального направления"], "remember": [{"t": "Последовательность — главный принцип", "d": "Одинаковые по функции кнопки не бывают разного цвета, одинаковые по иерархии заголовки — разного размера."}, {"t": "Имена через «/»", "d": "Текст: «Title/H1», «Body/T2». Цвет: «Text/Primary», «Background/Secondary». Так Figma сама разложит стили по группам."}, {"t": "Цвет называют по роли, а не по оттенку", "d": "Группы: Text, Background, Border, Icon. Внутри — Primary, Secondary, Tertiary, Success, Warning, Error. Если акцент один, хватит просто имени."}, {"t": "Styles, а не Variables — пока", "d": "Styles проще и их легко передать разработке — для лендинга этого хватит. Variables понадобятся в сложных проектах, например в приложении."}, {"t": "UI-кит «только для взрослых»", "d": "В ките лежат только родительские компоненты. В макеты идут их копии, а правишь всё из одного места."}, {"t": "Компонент = варианты × состояния", "d": "Кнопка: type (Primary, Secondary, Tertiary), size, state (Default, Hover, Pressed, Disabled, Loading), icon, theme."}], "visual": {"type": "flow", "title": "Атомарный дизайн", "items": [{"t": "Атомы", "d": "цвета, шрифты, кнопки, иконки, чекбоксы"}, {"t": "Молекулы", "d": "иконка + поле = поиск; чекбокс + подпись"}, {"t": "Организмы", "d": "карточка товара: фото, заголовок, цена, кнопка"}, {"t": "Шаблоны", "d": "организмы и молекулы в структуре экрана"}]}, "goodbad": [{"bad": "Стили цвета «Blue», «Grey 2», «Grey new»", "good": "«Text/Primary», «Background/Secondary», «Border/Primary»", "why": "Имя по роли сразу говорит, что этим цветом красить, и переживёт смену оттенка."}, {"bad": "Варианты кнопки создаются прямо в макете страницы", "good": "Все компоненты и варианты живут в UI-ките, в макет — только копии", "why": "Иначе правку придётся вносить вручную в каждом месте."}, {"bad": "У кнопки нарисован только default", "good": "Default, hover, pressed, disabled — всё, что встретится в сценариях", "why": "Разработчик не угадает состояние, которого нет в ките."}], "steps": ["Изучи готовый пример сайта и выпиши все размеры текста, цвета и типы элементов.", "Создай текстовые стили и сгруппируй их на Title и Body.", "Создай стили цвета и разложи их по ролям через «/».", "Визуализируй отступы прямоугольниками, найди базовую единицу и раздели внешние и внутренние.", "Собери UI-элементы в компоненты с вариантами и подпиши состояния сверху и справа.", "Прогони макет плагином Design Lint: все тексты и цвета должны быть на стилях."], "ai": ["Дай нейросети список блоков сайта и попроси составить полный перечень стилей и компонентов с именами через «/» и состояниями. Это чек-лист, чтобы ничего не забыть, — сверяй с макетом.", "Перечисли найденные HEX-коды и где они используются — попроси разложить их по ролям Text, Background, Border, Icon. Спорные места решай сам.", "Попроси написать короткое описание компонента для разработки: название, свойства, поведение при взаимодействии. Проверь, что состояния совпадают с вариантами в Figma."], "quiz": [{"q": "Как правильно назвать стиль второстепенного цвета текста?", "options": ["Grey #AAAAAA", "Text/Secondary", "Цвет 2"], "correct": 1, "explain": ["Имя по оттенку не говорит, где цвет использовать.", "Верно: роль и уровень через «/» — Figma сгруппирует, а разработчик поймёт назначение.", "Номер ничего не объясняет и быстро запутывает."]}, {"q": "Что значит «UI-кит только для взрослых»?", "options": ["Кит не показывают заказчику", "В ките только родительские компоненты, а в макетах — их копии", "В ките только сложные элементы"], "correct": 1, "explain": ["Речь не о доступе, а об устройстве кита.", "Верно: так любую правку вносишь в одном месте, и она расходится по всем макетам.", "Простые элементы тоже должны быть в ките."]}, {"q": "Что выбрать для цветов в UI-ките лендинга?", "options": ["Styles", "Variables", "Не создавать стили, красить вручную"], "correct": 0, "explain": ["Верно: для небольшого проекта Styles удобны и легко передаются разработке.", "Variables нужны для более сложных проектов, например приложения.", "Без стилей не будет системы и консистентности."]}, {"q": "Поле поиска с иконкой лупы — это какой уровень атомарного дизайна?", "options": ["Атом", "Молекула", "Организм", "Шаблон"], "correct": 1, "explain": ["Атомы — отдельные иконки и поля, а здесь они уже соединены.", "Верно: иконка + поле = поиск.", "Организм — крупнее, например карточка товара из фото, заголовка, цены и кнопки.", "Шаблон — структура целого экрана."]}, {"q": "На одной странице макета заголовки одного уровня — 32 и 36 px, а одинаковые кнопки «Купить» — синяя и фиолетовая. Какой принцип нарушен?", "options": ["Последовательность", "Атомарность", "Ничего не нарушено — это разнообразие"], "correct": 0, "explain": ["Верно: одинаковые по функции и иерархии элементы должны выглядеть одинаково.", "Атомарный дизайн — про уровни сборки, а здесь проблема в разнобое.", "Такое «разнообразие» путает пользователя и разработчика."]}, {"q": "Бренд сменил акцентный синий на зелёный. В ките стиль назван «Blue». В чём проблема?", "options": ["Никакой: поменяешь цвет в стиле — и готово", "Придётся удалять стиль и перекрашивать макет вручную", "Имя по оттенку врёт после замены — стиль надо было назвать по роли"], "correct": 2, "explain": ["Цвет поменяется, но имя «Blue» будет врать.", "Перекрашивать не надо, ломается именно имя.", "Верно: имя по роли, например «Text/Primary», переживёт смену оттенка."]}, {"q": "Дизайнер сделал вариант кнопки прямо в макете страницы, а не в ките. К чему это приведёт?", "options": ["Ни к чему: в макете даже удобнее", "Figma выдаст ошибку", "Правку этого варианта придётся вносить руками в каждом месте"], "correct": 2, "explain": ["Удобно до первой правки.", "Figma позволит, проблема не техническая.", "Верно: компоненты живут в ките, в макет идут только копии."]}, {"q": "Кнопка бывает Primary и Secondary, трёх размеров, с иконкой и без, в светлой и тёмной теме. Как собрать её в Figma?", "options": ["Нарисовать отдельный компонент под каждую комбинацию", "Сделать один компонент с вариантами по свойствам: type, size, state, icon, theme", "Нарисовать только Primary, остальное разработчик додумает"], "correct": 1, "explain": ["Получится десятки разрозненных компонентов, которые сложно поддерживать.", "Верно: компонент = варианты × состояния.", "Разработчик не угадает то, чего нет в ките."]}, {"q": "Когда собирать UI-кит для лендинга?", "options": ["В самом начале, до вайрфрейма", "После того как сайт уже сверстан", "Параллельно со смысловым прототипом", "После утверждённого каркаса и визуального направления"], "correct": 3, "explain": ["Пока нет каркаса и визуального направления, собирать ещё не из чего.", "Кит нужен разработчику до вёрстки.", "На этом этапе визуального направления ещё нет.", "Верно: тогда понятно, какие элементы и стили реально есть в макете."]}, {"q": "Ты разбираешь чужой макет и хочешь найти систему отступов. Что делать?", "options": ["Взять шкалу 8pt по умолчанию, не глядя в макет", "Визуализировать отступы прямоугольниками, найти базовую единицу и разделить внешние и внутренние", "Прогнать макет через Design Lint"], "correct": 1, "explain": ["Нужно найти систему именно этого макета.", "Верно: так система становится видна.", "Design Lint проверяет тексты и цвета на стилях, а не отступы."]}], "task": {"title": "UI-кит для сайта Mac Pro", "time": "2–4 часа", "steps": ["Продублируй файл задания к себе и добавь в название имя и фамилию в скобках.", "Посмотри видео-разбор задания и изучи готовый пример сайта и UI-кита: найди в нём систему.", "Текстовые стили: выпиши все размеры текста, раздели на Title (H1, H2, H3…) и Body (T1, T2, T3…), назови через «/», например «Title/H1», «Body/T2». Можно подписать размер, интерлиньяж и шрифт.", "Стили цвета: собери все цвета макета и разложи по ролям — Text, Background, Border, Icon × Primary, Secondary, Tertiary, Success, Warning, Error. Например «Text/Primary», «Background/Secondary». Используй Styles, не Variables.", "Сетка и отступы: визуализируй расстояния прямоугольниками, найди базовую единицу и раздели внешние отступы (между блоками) и внутренние (внутри блока).", "UI-элементы: найди кнопки, ссылки, чекбоксы, слайдер, переключатели, выпадающие списки, поля, табы, радиокнопки. Сделай из них компоненты с вариантами и всеми нужными состояниями (default, hover и т.д.).", "Оставь в ките только родительские компоненты — в макет идут их копии.", "Проверь макет плагином Design Lint, допиши в скобках в названии файла, за сколько выполнил, и прикрепи файл на платформе."], "check": ["Название файла: имя, фамилия и время выполнения в скобках", "Все текстовые стили названы через «/» и разделены на Title и Body", "Цвета названы по ролям, а не по оттенкам", "Отступы визуализированы, внешние и внутренние разделены", "У каждого UI-элемента есть все состояния, собранные в варианты", "В ките только родительские компоненты", "Design Lint не находит текстов и цветов без стилей", "Стили расставлены по иерархии"]}}, {"id": "web-and-business", "block": "web", "order": 1, "title": "Веб-дизайн и бизнес", "lead": "Сайт — инструмент бизнеса, а не витрина. Теперь ты понимаешь, какие задачи он решает, где стоит в воронке продаж и что такое целевое действие.", "time": "15 минут", "covered": ["Что такое веб-дизайн: UX, UI и коммуникация", "Задачи сайта: объяснить, впечатлить, доказать ценность, снять риск, привести к действию", "Целевое действие и лид-магнит", "Функции сайтов: информационная, коммуникационная, продающая, имиджевая", "Как устроен бизнес: рынок, аудитория, продукт, маркетинг, продажи", "Воронка продаж, лестница осведомлённости, B2C и B2B"], "remember": [{"t": "Дизайн — это инструмент", "d": "Он формирует доверие, объясняет ценность и ведёт к нужному действию. Красота без этого не приносит результата."}, {"t": "Тест 5 секунд", "d": "Покажи первый экран на 5–7 секунд. Человек должен сказать, что это, для кого и какое ощущение осталось."}, {"t": "Целевое действие измеримо", "d": "«Увеличить продажи» — цель бизнеса. «Оставил заявку», «начал пробный период», «оплатил» — то, что можно посчитать."}, {"t": "Покупка — не первый шаг", "d": "Путь: интерес → знакомство → доверие → решение → покупка. Поэтому часто нужен промежуточный шаг: консультация, пробный урок, лид-магнит."}, {"t": "Аудитория — не «все»", "d": "Это сегменты с разными задачами. Покупатель и пользователь могут быть разными людьми: HR покупает сервис, сотрудники им пользуются."}, {"t": "B2C и B2B говорят по-разному", "d": "B2C — эмоция, простота, ощущение выгоды. B2B — структура, факты, кейсы, цифры."}, {"t": "Сайт работает для всех уровней готовности", "d": "Объяснить тому, кто только разбирается, убедить сомневающегося и дать быстро купить тому, кто уже готов."}], "visual": {"type": "flow", "title": "Логика продающей страницы", "items": [{"t": "Контекст", "d": "Куда я попал и про что это"}, {"t": "Проблема", "d": "Узнаваемая ситуация пользователя"}, {"t": "Решение", "d": "Что предлагает продукт"}, {"t": "Преимущества", "d": "Чем лучше альтернатив"}, {"t": "Доказательства", "d": "Кейсы, отзывы, клиенты, цифры"}, {"t": "Предложение", "d": "Условия: что входит, сроки, формат"}, {"t": "Действие", "d": "Один понятный следующий шаг"}]}, "goodbad": [{"bad": "Кнопка «Отправить», а рядом ещё три одинаково яркие кнопки.", "good": "Один главный CTA, где текст говорит о результате: «Получить расчёт», «Начать пробный период».", "why": "Человек сразу видит, что делать и что он получит."}, {"bad": "Сразу «Купить» для человека, который впервые видит бренд.", "good": "Промежуточное действие: бесплатный урок, как у Skyeng, или тест-драйв, как у Cowboy.", "why": "Большинство не доверяют компании с первого визита и не готовы платить сразу."}, {"bad": "«Наша аудитория — женщины 25–40 с высоким доходом».", "good": "Портрет: потребность, опыт её решения, сомнения.", "why": "Демография почти ничего не говорит о том, что человеку показать и чем убедить."}], "steps": ["Сформулируй одной фразой: кто компания, что делает, для кого и какой результат даёт.", "Определи главное целевое действие сайта и промежуточный шаг для тех, кто ещё не готов.", "Опиши 2–3 сегмента аудитории: потребность, опыт её решения, сомнения.", "Определи, B2C это или B2B, и выбери тон: эмоция и простота или структура и факты.", "Разложи будущую страницу по логике «контекст → проблема → решение → преимущества → доказательства → предложение → действие».", "Проверь первый экран тестом 5 секунд на знакомом человеке."], "ai": ["Отдай нейросети описание продукта и попроси 3–4 сегмента аудитории с потребностями и сомнениями. Это гипотезы: сверь их с брифом и реальными людьми.", "Попроси варианты промежуточного целевого действия и лид-магнитов для твоей ниши. Оставь только то, что бизнес реально может дать.", "Вставь текст первого экрана и попроси ответить как случайный посетитель: что это, для кого, какой результат. Если ответ мимо — переписывай текст."], "quiz": [{"q": "Что из этого — целевое действие?", "options": ["Повысить узнаваемость бренда", "Пользователь оставил заявку на консультацию", "Сделать сайт современным"], "correct": 1, "explain": ["Это цель бизнеса: её нельзя увидеть как одно действие пользователя.", "Верно: это конкретное действие, которое можно посчитать.", "Это пожелание к дизайну, а не действие пользователя."]}, {"q": "Зачем Skyeng предлагает бесплатный пробный урок?", "options": ["Чтобы украсить сайт", "Это промежуточный шаг: снимает недоверие и приводит человека в воронку", "Чтобы вообще не продавать курсы"], "correct": 1, "explain": ["Лид-магнит решает задачу бизнеса, а не декоративную.", "Верно: человеку проще сделать небольшой шаг, чем сразу платить.", "Пробный урок ведёт к продаже, а не заменяет её."]}, {"q": "Что важнее на сайте для B2B-аудитории?", "options": ["Минимум текста и много эмоций", "Структура, факты, кейсы и цифры", "Анимации на каждом экране"], "correct": 1, "explain": ["Это подход для B2C, бизнес так не убедить.", "Верно: в B2B нужно доказать компетенцию и надёжность.", "Анимации не отвечают на вопросы, по которым компания выбирает подрядчика."]}, {"q": "Ты показал первый экран другу на 5–7 секунд. Ответ: «Красиво, но не понял, что тут продают». Что делать?", "options": ["Добавить анимацию, чтобы удержать внимание", "Ничего: главное, что осталось приятное ощущение", "Переписать оффер и описание, чтобы было ясно, что это и для кого", "Показывать экран дольше, хотя бы минуту"], "correct": 2, "explain": ["Анимация не объяснит, что это и для кого.", "Тест провален: человек должен назвать, что это и для кого.", "Верно: первый экран должен отвечать на эти вопросы за секунды.", "В жизни у первого экрана нет минуты: человек закроет вкладку."]}, {"q": "Найди ошибку: на первом экране кнопки «Отправить», «Подробнее», «Скачать» и «Позвонить», все одинаково яркие.", "options": ["Кнопок слишком мало", "Кнопки должны быть круглыми", "На первом экране вообще не должно быть кнопок", "Нет одного главного CTA, а «Отправить» не говорит о результате"], "correct": 3, "explain": ["Проблема не в количестве, а в отсутствии главной.", "Форма кнопки здесь ни при чём.", "Кнопка на первом экране нужна: это путь к целевому действию.", "Верно: нужен один заметный CTA с текстом о результате, например «Получить расчёт»."]}, {"q": "Почему описание «женщины 25–40 с высоким доходом» плохо помогает проектировать сайт?", "options": ["Демография не говорит, что человеку показать и чем его убедить", "Возрастной диапазон слишком узкий", "Доход аудитории дизайнеру знать запрещено"], "correct": 0, "explain": ["Верно: нужны потребность, опыт её решения и сомнения.", "Дело не в ширине диапазона, а в типе описания.", "Знать можно, просто этого мало для решений по странице."]}, {"q": "Сервис для компаний: покупает его HR, а пользуются сотрудники. Как это учесть на сайте?", "options": ["Писать только для сотрудников — они же пользователи", "Писать только для HR — он платит", "Это разные сегменты с разными задачами, сайт отвечает обоим"], "correct": 2, "explain": ["Тогда не убедишь того, кто принимает решение и платит.", "Сотрудники тоже часть аудитории, их опыт влияет на выбор.", "Верно: покупатель и пользователь могут быть разными людьми."]}, {"q": "Ты делаешь сайт онлайн-школы, большинство посетителей впервые видят бренд. Какое целевое действие поставить главным?", "options": ["Сразу «Купить курс»", "Подписаться на все соцсети школы", "Прочитать историю основателя", "Промежуточный шаг: бесплатный урок или консультация"], "correct": 3, "explain": ["Человек ещё не доверяет компании и не готов платить.", "Это не ведёт к продаже и распыляет внимание.", "Это не действие, которое можно посчитать и которое двигает к покупке.", "Верно: небольшой шаг снимает недоверие и приводит в воронку, как пробный урок Skyeng."]}, {"q": "Какой порядок соответствует логике продающей страницы?", "options": ["Контекст → проблема → решение → преимущества → доказательства → предложение → действие", "Действие → предложение → контекст → проблема → решение", "Доказательства → контекст → действие → проблема"], "correct": 0, "explain": ["Верно: от «куда я попал» к одному понятному шагу.", "Просить действие до того, как человек понял, что это, рано.", "Доказательства без контекста непонятно к чему относятся."]}, {"q": "Что ет — это роли, статусы, таблицы и дизайн-система, а не эффекты."}], "visual": {"type": "grid", "title": "Основные типы проектов", "items": [{"t": "Лендинг", "d": "Одна страница, одна цель: заявка или покупка"}, {"t": "Корпоративный сайт", "d": "Несколько страниц и аудиторий, задача — доверие к компании"}, {"t": "Интернет-магазин", "d": "Каталог → карточка → корзина → оплата"}, {"t": "Лонгрид", "d": "Одностраничная история, насыщенная контентом"}, {"t": "Портфолио", "d": "Кейсы и позиционирование специалиста или студии"}, {"t": "SaaS, веб-сервис", "d": "Интерфейс для регулярной работы: таблицы, роли, настройки"}, {"t": "Спецпроект", "d": "Кампания или PR: эмоция, история, вовлечение"}, {"t": "Редизайн", "d": "Улучшить структуру, UX и метрики, не потеряв SEO"}]}, "goodbad": [{"bad": "Делать корпоративный сайт как лендинг с эффектами.", "good": "Сначала продумать информационную архитектуру и навигацию.", "why": "У корпоративного сайта несколько аудиторий: клиенты, партнёры, кандидаты, СМИ."}, {"bad": "Портфолио как галерея картинок без контекста.", "good": "Каждый кейс: задача → процесс → результат и твоя роль в команде.", "why": "Заказчик выбирает по тому, как ты думаешь, а не только по картинкам."}, {"bad": "Оценивать любой проект одной метрикой.", "good": "Лендинг — конверсия, медиа — время и возвраты, SaaS — активация и удержание.", "why": "У каждого формата своя задача, значит, и свой критерий успеха."}], "steps": ["Назови тип своего проекта формулой «формат + цель + сложность».", "Определи, кто пользователи: B2C, B2B или сотрудники компании.", "Оцени сложность UX: один поток, несколько разделов или система с ролями.", "Выбери 1–2 главные метрики, по которым будешь оценивать результат.", "Найди 3–5 референсов того же типа, а не просто «красивые сайты»."], "ai": ["Опиши задачу клиента и попроси нейросеть разложить проект по осям: формат, сложность, пользователи, метрики. Спорь с ответом — это черновик, а не решение.", "Попроси список типовых разделов и сценариев дл   ${t?sec("Задание",`<div class="task"><span class="k">Задание урока${t.time?" · "+esc(t.time):""}</span><b>${esc(t.title)}</b>
     <ol class="steps">${(t.steps||[]).map(s=>`<li><span>${fmt(s)}</span></li>`).join("")}</ol></div>
     ${t.check&&t.check.length?`<h3>Проверь перед сдачей куратору</h3><div class="check">${t.check.map(c=>`<label><input type="checkbox"><span>${fmt(c)}</span></label>`).join("")}</div>`:""}`):""}
  ${sec("Проверь себя",`<div class="q" id="quiz"></div>`)}
  <nav class="pager">${prev?`<a href="#${prev.id}"><span class="mono">← Предыдущая</span>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="next" href="#${next.id}"><span class="mono">Следующая →</span>${esc(next.title)}</a>`:""}</nav>
  <footer>Perasperadastra · Mission to Web · урок ${num}</footer>`;
  quiz(h.quiz);
  window.scrollTo(0,0);
}

function quiz(qs){
  const box=document.getElementById("quiz");let i=0,score=0;
  const draw=()=>{
    if(i>=qs.length){box.innerHTML=`<span class="qn">Итог</span><span class="big">${score} из ${qs.length}</span><p>${score===qs.length?"Всё верно, можно переходить к заданию.":"Перечитай блок «Запомни» и попробуй ещё раз."}</p><div class="qnav"><button class="btn ghost" id="again">Пройти заново</button></div>`;
      document.getElementById("again").onclick=()=>{i=0;score=0;draw()};return;}
    const q=qs[i];
    box.innerHTML=`<span class="qn">Вопрос ${i+1} из ${qs.length}</span><p class="p">${fmt(q.q)}</p>
    <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}"><span>${fmt(o)}</span><span class="ex">${fmt((q.explain||[])[k]||"")}</span></button>`).join("")}</div>
    <div class="qnav"><span class="res"></span><button class="btn" id="nextq" hidden>${i+1<qs.length?"Следующий вопрос":"Результат"}</button></div>`;
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;if(k===q.correct)score++;
      box.querySelectorAll(".opt").forEach(x=>{const xk=+x.dataset.k;x.disabled=true;
        if(xk===q.correct)x.classList.add("right","shown");if(xk===k){x.classList.add("shown");if(k!==q.correct)x.classList.add("wrong")}});
      box.querySelector(".res").textContent=k===q.correct?"Верно":"Не совсем";
      const nb=document.getElementById("nextq");nb.hidden=false;nb.focus();nb.onclick=()=>{i++;draw()};
    });
  };draw();
}

function route(){const id=decodeURIComponent(location.hash.slice(1));const h=ORDER.find(x=>x.id===id);h?handout(h):toc()}
addEventListener("hashchange",route);route();
</script>
