<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Методички Mission to Web</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Рабочий стол проверки: слева оглавление модулей, справа методичка как есть. Тёмная тема школы, одна. */
:root{color-scheme:dark;--field:#1c1c1c;--panel:#101010;--card:#191919;--stroke:#2a2a2a;--ink:#f4f4f2;--dim:#8e8e8c;--faint:#5a5a58;--accent:#eb7540;--good:#34c759;
--body:"Onest",-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--field);color:var(--dim);font:15px/1.4 var(--body);display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
aside{background:var(--panel);border-radius:14px;padding:20px 14px;display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);line-height:1.4;padding:0 6px}
h1{margin:0;font-weight:400;font-size:24px;line-height:1.05;color:var(--ink);letter-spacing:-.02em;padding:0 6px}
.prog{padding:0 6px;display:flex;flex-direction:column;gap:6px}
.prog .bar{height:4px;border-radius:2px;background:var(--stroke);overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.prog span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.grp{display:flex;flex-direction:column;gap:2px}
.gname{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 6px 6px}
.it{display:grid;grid-template-columns:24px minmax(0,1fr) 14px;gap:8px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 6px;color:var(--dim);font:inherit;cursor:pointer}
.it:hover{background:var(--card)}
.it:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.it[aria-current="true"]{background:var(--card);border-color:var(--stroke);color:var(--ink)}
.it .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.it .ok{width:10px;height:10px;border-radius:50%;border:1px solid var(--faint)}
.it.done .ok{background:var(--good);border-color:var(--good)}
main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-width:0;min-height:0}
.bar-top{background:var(--panel);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar-top .cur{color:var(--ink);font-size:17px;flex:1 1 200px;min-width:0}
.bar-top .cur small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
button.b{background:var(--card);color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.b[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.notes{flex:1 1 100%;display:none}
.notes.open{display:flex;flex-direction:column;gap:6px}
.notes textarea{width:100%;min-height:72px;resize:vertical;background:var(--card);color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:10px 12px;font:inherit}
.notes span{font-size:13px}
.frame{background:var(--panel);border-radius:14px;overflow:hidden;min-height:0}
iframe{display:block;width:100%;height:100%;border:0;background:#1c1c1c}
select{display:none}
@media (max-width:900px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  aside{display:none}
  select{display:block;flex:1 1 100%;background:var(--card);color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:10px;font:inherit}
  .bar-top .cur{display:none}
}
@media (prefers-reduced-motion:reduce){.prog .bar i{transition:none}}
</style>
<aside>
  <div class="brand">PERASPERADASTRA<br>MISSION TO WEB</div>
  <h1>Методички модулей 3–6</h1>
  <div class="prog"><div class="bar"><i id="pbar"></i></div><span id="ptxt">Проверено 0 из 17</span></div>
  <nav aria-label="Методички"><div class="grp"><span class="gname">Модуль 3 · Веб-дизайн</span><button type="button" class="it" data-slug="web-biznes"><span class="n">01</span><span class="t">Веб-дизайн и бизнес</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="tipy-proektov"><span class="n">02</span><span class="t">Типы проектов</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="metriki"><span class="n">03</span><span class="t">Метрики сайта</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="tipy-stranic"><span class="n">04</span><span class="t">Типы страниц</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="tipy-blokov"><span class="n">05</span><span class="t">Типы блоков</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="principy"><span class="n">06</span><span class="t">Принципы веб-дизайна</span><span class="ok" aria-hidden="true"></span></button></div><div class="grp"><span class="gname">Модуль 4 · UI</span><button type="button" class="it" data-slug="stili"><span class="n">01</span><span class="t">Стили в веб-дизайне</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="tipografika"><span class="n">02</span><span class="t">Типографика</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="cvet"><span class="n">03</span><span class="t">Цвет</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="kompoziciya"><span class="n">04</span><span class="t">Композиция</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="ui-elementy"><span class="n">05</span><span class="t">UI-элементы</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="ikonki"><span class="n">06</span><span class="t">Иконки</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="adaptiv"><span class="n">07</span><span class="t">Адаптив</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="ui-kit"><span class="n">08</span><span class="t">UI-кит</span><span class="ok" aria-hidden="true"></span></button></div><div class="grp"><span class="gname">Модуль 5 · Референсы</span><button type="button" class="it" data-slug="referensy"><span class="n">01</span><span class="t">Референсы</span><span class="ok" aria-hidden="true"></span></button><button type="button" class="it" data-slug="konkurentnyj-analiz"><span class="n">02</span><span class="t">Конкурентный анализ</span><span class="ok" aria-hidden="true"></span></button></div><div class="grp"><span class="gname">Модуль 6 · Концепция</span><button type="button" class="it" data-slug="koncepciya-web"><span class="n">01</span><span class="t">Концепция в веб-дизайне</span><span class="ok" aria-hidden="true"></span></button></div></nav>
</aside>
<main>
  <div class="bar-top">
    <select id="pick" aria-label="Выбрать методичку"><option value="web-biznes">Модуль 3 · Веб-дизайн и бизнес</option><option value="tipy-proektov">Модуль 3 · Типы проектов</option><option value="metriki">Модуль 3 · Метрики сайта</option><option value="tipy-stranic">Модуль 3 · Типы страниц</option><option value="tipy-blokov">Модуль 3 · Типы блоков</option><option value="principy">Модуль 3 · Принципы веб-дизайна</option><option value="stili">Модуль 4 · Стили в веб-дизайне</option><option value="tipografika">Модуль 4 · Типографика</option><option value="cvet">Модуль 4 · Цвет</option><option value="kompoziciya">Модуль 4 · Композиция</option><option value="ui-elementy">Модуль 4 · UI-элементы</option><option value="ikonki">Модуль 4 · Иконки</option><option value="adaptiv">Модуль 4 · Адаптив</option><option value="ui-kit">Модуль 4 · UI-кит</option><option value="referensy">Модуль 5 · Референсы</option><option value="konkurentnyj-analiz">Модуль 5 · Конкурентный анализ</option><option value="koncepciya-web">Модуль 6 · Концепция в веб-дизайне</option></select>
    <div class="cur"><small id="cur-mod"></small><span id="cur-t"></span></div>
    <button type="button" class="b" id="prev">← Назад</button>
    <button type="button" class="b" id="next">Дальше →</button>
    <button type="button" class="b" id="done" aria-pressed="false">Проверено</button>
    <button type="button" class="b" id="nbtn" aria-expanded="false">Заметки</button>
    <div class="notes" id="notes"><textarea id="ntext" placeholder="Что поправить в этой методичке"></textarea><span>Заметки и отметки хранятся только в этом браузере. Чтобы передать правки, скопируй их в чат.</span></div>
  </div>
  <div class="frame"><iframe id="view" title="Методичка"></iframe></div>
</main>

<script>
(function(){
  const ORDER=[{"slug": "web-biznes", "title": "Веб-дизайн и бизнес", "mod": "Модуль 3 · Веб-дизайн"}, {"slug": "tipy-proektov", "title": "Типы проектов", "mod": "Модуль 3 · Веб-дизайн"}, {"slug": "metriki", "title": "Метрики сайта", "mod": "Модуль 3 · Веб-дизайн"}, {"slug": "tipy-stranic", "title": "Типы страниц", "mod": "Модуль 3 · Веб-дизайн"}, {"slug": "tipy-blokov", "title": "Типы блоков", "mod": "Модуль 3 · Веб-дизайн"}, {"slug": "principy", "title": "Принципы веб-дизайна", "mod": "Модуль 3 · Веб-дизайн"}, {"slug": "stili", "title": "Стили в веб-дизайне", "mod": "Модуль 4 · UI"}, {"slug": "tipografika", "title": "Типографика", "mod": "Модуль 4 · UI"}, {"slug": "cvet", "title": "Цвет", "mod": "Модуль 4 · UI"}, {"slug": "kompoziciya", "title": "Композиция", "mod": "Модуль 4 · UI"}, {"slug": "ui-elementy", "title": "UI-элементы", "mod": "Модуль 4 · UI"}, {"slug": "ikonki", "title": "Иконки", "mod": "Модуль 4 · UI"}, {"slug": "adaptiv", "title": "Адаптив", "mod": "Модуль 4 · UI"}, {"slug": "ui-kit", "title": "UI-кит", "mod": "Модуль 4 · UI"}, {"slug": "referensy", "title": "Референсы", "mod": "Модуль 5 · Референсы"}, {"slug": "konkurentnyj-analiz", "title": "Конкурентный анализ", "mod": "Модуль 5 · Референсы"}, {"slug": "koncepciya-web", "title": "Концепция в веб-дизайне", "mod": "Модуль 6 · Концепция"}];
  const END="%%END_SCRIPT%%";
  const $=s=>document.querySelector(s);
  const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  let done=store.get('mtw-done',{}), notes=store.get('mtw-notes',{}), cur=null;
  const items=[...document.querySelectorAll('.it')];
  function progress(){
    const n=ORDER.filter(o=>done[o.slug]).length;
    $('#pbar').style.width=(n/ORDER.length*100)+'%'; $('#ptxt').textContent='Проверено '+n+' из '+ORDER.length;
    items.forEach(b=>b.classList.toggle('done',!!done[b.dataset.slug]));
  }
  function open(slug){
    const i=ORDER.findIndex(o=>o.slug===slug); if(i<0)return; cur=ORDER[i];
    $('#view').src=slug+'/';
    items.forEach(b=>b.setAttribute('aria-current',String(b.dataset.slug===slug)));
    $('#pick').value=slug; $('#cur-mod').textContent=cur.mod; $('#cur-t').textContent=cur.title;
    $('#done').setAttribute('aria-pressed',String(!!done[slug])); $('#done').textContent=done[slug]?'Проверено ✓':'Проверено';
    $('#ntext').value=notes[slug]||'';
    $('#prev').disabled=i===0; $('#next').disabled=i===ORDER.length-1;
    store.set('mtw-cur',slug);
    try{history.replaceState(null,'','#'+slug)}catch(e){}
  }
  items.forEach(b=>b.addEventListener('click',()=>open(b.dataset.slug)));
  $('#pick').addEventListener('change',e=>open(e.target.value));
  $('#prev').addEventListener('click',()=>{const i=ORDER.indexOf(cur);if(i>0)open(ORDER[i-1].slug)});
  $('#next').addEventListener('click',()=>{const i=ORDER.indexOf(cur);if(i<ORDER.length-1)open(ORDER[i+1].slug)});
  $('#done').addEventListener('click',()=>{done[cur.slug]=!done[cur.slug];store.set('mtw-done',done);progress();$('#done').setAttribute('aria-pressed',String(!!done[cur.slug]));$('#done').textContent=done[cur.slug]?'Проверено ✓':'Проверено'});
  $('#nbtn').addEventListener('click',()=>{const o=$('#notes').classList.toggle('open');$('#nbtn').setAttribute('aria-expanded',String(o))});
  $('#ntext').addEventListener('input',e=>{notes[cur.slug]=e.target.value;store.set('mtw-notes',notes)});
  progress();
  const h=(location.hash||'').slice(1);
  open(ORDER.some(o=>o.slug===h)?h:store.get('mtw-cur',ORDER[0].slug));
})();
</script>

</body>
</html>
